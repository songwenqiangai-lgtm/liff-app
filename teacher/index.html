<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师端 · 研究数据平台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f4f6f5; color: #22332c; }
    h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin: 4px 0 10px; }
    .muted { color: #6d7f77; font-size: 0.85rem; margin-bottom: 10px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px;
            box-shadow: 0 1px 6px rgba(34,51,44,.08); }
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    th, td { border-bottom: 1px solid #e4ebe7; padding: 6px 8px; text-align: left; white-space: nowrap; }
    th { background: #eef4f1; position: sticky; top: 0; }
    td.wrap { white-space: normal; max-width: 300px; }
    button, select, input, textarea { padding: 8px 11px; border-radius: 9px; border: 1px solid #cfdad4;
            font-size: 0.9rem; cursor: pointer; font-family: inherit; background: #fff; }
    textarea { width: 100%; min-height: 70px; }
    .btn-primary { background: #1f8a5f; color: #fff; border: none; }
    .btn-sm { padding: 5px 9px; font-size: 0.8rem; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .tag-open { background: #fbe3e0; color: #a33b2e; } .tag-closed { background: #dcf2e6; color: #14603f; }
    .badge { background: #c0392b; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 0.75rem; }
    .notif-row { padding: 10px 12px; border-bottom: 1px solid #e6f0eb; border-left: 4px solid transparent; }
    .notif-row.unread { background: #ecf6f0; border-left-color: #1f8a5f; cursor: pointer; }
    .notif-row .nr-kind { font-size: 0.72rem; color: #1f8a5f; font-weight: 700; letter-spacing: .05em; }
    .notif-row .nr-title { font-weight: 700; margin-top: 2px; }
    .notif-row .nr-body { font-size: 0.85rem; color: #415c52; margin-top: 2px; }
    .notif-row .nr-time { font-size: 0.72rem; color: #6b8579; margin-top: 4px; }
    #login { max-width: 380px; margin: 80px auto; }
    .layout { display: flex; min-height: 100vh; }
    .sidenav { width: 170px; background: #22332c; color: #dfeae4; padding: 14px 8px; flex-shrink: 0; }
    .sidenav h3 { font-size: 0.95rem; margin-bottom: 10px; padding: 0 8px; }
    .nav-item { display: block; width: 100%; text-align: left; background: none; border: none; color: #cfe0d8;
                padding: 9px 10px; border-radius: 8px; margin-bottom: 2px; font-size: 0.85rem; cursor: pointer; }
    .nav-item:hover { background: #2e463c; }
    .nav-item.active { background: #1f8a5f; color: #fff; }
    #view { flex: 1; padding: 18px; overflow-x: auto; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 6px rgba(34,51,44,.08); }
    .stat .num { font-size: 1.6rem; font-weight: 700; color: #1f8a5f; }
    .stat .lbl { font-size: 0.8rem; color: #6d7f77; }
    .check-item { display: block; padding: 8px 0; border-bottom: 1px solid #eef4f1; }
    .error-text { color: #a3541f; font-size: 0.85rem; margin-top: 8px; }

    /* ---------- 手机端适配（LINE 内建浏览器，唯一目标环境） ---------- */
    @media (max-width: 760px) {
      /* 侧边栏从左侧竖排改为顶部横向滚动标签条 */
      .layout { flex-direction: column; min-height: auto; }
      .sidenav { width: 100%; display: flex; gap: 6px; overflow-x: auto;
                 padding: 8px 10px; position: sticky; top: 0; z-index: 20;
                 -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .sidenav::-webkit-scrollbar { display: none; }
      .sidenav h3 { display: none; }
      .nav-item { display: inline-block; width: auto; flex: 0 0 auto;
                  white-space: nowrap; margin-bottom: 0; padding: 8px 12px; }
      /* 主内容占满整屏 */
      #view { padding: 12px; }
      h1 { font-size: 1.15rem; }
      /* 表格在自己的卡片里横向滚动，而不是被 205px 的窄栏裁掉 */
      .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      th { position: static; }
      th, td { padding: 6px 7px; }
      td.wrap { max-width: 170px; }
      .stat-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .row { gap: 6px; }
      button, select, input, textarea { font-size: 0.85rem; }
      #login { margin: 40px 16px; }
    }
  </style>
</head>
<body>
  <div id="login" class="card">
    <h2>🔒 教师登录</h2>
    <p class="muted">密码 = 后端环境变量 TEACHER_PASSWORD</p>
    <input type="password" id="pwd" placeholder="密码" style="width:100%">
    <button class="btn-primary" id="btn-login" style="margin-top:10px;width:100%;padding:12px">登录</button>
  </div>
  <div id="app" style="display:none">
    <div class="layout">
      <nav class="sidenav">
        <h3>🎓 研究数据平台</h3>
        <button class="nav-item active" data-view="overview">📊 班级总览</button>
        <button class="nav-item" data-view="weekly">📈 班级周报</button>
        <button class="nav-item" data-view="notifications">🔔 通知中心<span id="notif-badge"></span></button>
        <button class="nav-item" data-view="students">👤 学生行为</button>
        <button class="nav-item" data-view="handoffs">🔁 交接队列<span id="handoff-badge"></span></button>
        <button class="nav-item" data-view="handoff-new">➕ 交接补录</button>
        <button class="nav-item" data-view="avoidance">⚠️ 回避预警</button>
        <button class="nav-item" data-view="inject">💉 T4 注入</button>
        <button class="nav-item" data-view="fidelity">📋 保真度</button>
        <button class="nav-item" data-view="phases">🔄 阶段管理</button>
        <button class="nav-item" data-view="assign">📚 课程分配</button>
        <button class="nav-item" data-view="native">🀄 中文班看板</button>
        <button class="nav-item" data-view="assignments">📝 作业管理</button>
        <button class="nav-item" data-view="dictation">✍️ 听写背诵</button>
        <button class="nav-item" data-view="writings">📄 作文批改</button>
        <button class="nav-item" data-view="assessments">📝 成绩录入</button>
        <button class="nav-item" data-view="export">⬇ 数据导出</button>
        <button class="nav-item" data-view="account">🔑 改密码</button>
        <button class="nav-item" id="btn-logout">🚪 退出</button>
      </nav>
      <main id="view"></main>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "teacher_token";
    let CURRENT = "overview";

    document.getElementById("btn-login").onclick = async () => {
      const pwd = document.getElementById("pwd").value;
      const r = await fetch("/teacher/overview", { headers: { "X-Teacher-Token": pwd } });
      if (r.status !== 200) { alert("密码错误"); return; }
      localStorage.setItem(TOKEN_KEY, pwd);
      showApp();
    };
    document.getElementById("btn-logout").onclick = () => {
      localStorage.removeItem(TOKEN_KEY); location.reload();
    };
    (async () => {
      const saved = localStorage.getItem(TOKEN_KEY);
      if (!saved) return;
      const r = await fetch("/teacher/overview", { headers: { "X-Teacher-Token": saved } });
      if (r.status !== 200) return;
      showApp();
    })();

    function showApp() {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      nav();
      go(CURRENT);
      updateBadge();
    }
    async function api(path, opts = {}) {
      const r = await fetch(path, { ...opts,
        headers: { "Content-Type": "application/json", "X-Teacher-Token": localStorage.getItem(TOKEN_KEY), ...(opts.headers || {}) } });
      if (r.status === 401) { alert("会话过期"); location.reload(); throw new Error("401"); }
      if (!r.ok) { const t = await r.text(); throw new Error(t || "请求失败"); }
      return r.json();
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    async function updateBadge() {
      try {
        const d = await api("/teacher/overview");
        const b = document.getElementById("handoff-badge");
        b.innerHTML = d.open_handoffs_total ? `<span class="badge">${d.open_handoffs_total}</span>` : "";
        const nb = document.getElementById("notif-badge");
        if (nb) nb.innerHTML = d.unread_notifications ? `<span class="badge">${d.unread_notifications}</span>` : "";
      } catch (e) {}
    }
    function nav() {
      document.querySelectorAll(".nav-item[data-view]").forEach(b => {
        b.classList.toggle("active", b.dataset.view === CURRENT);
        b.onclick = () => { CURRENT = b.dataset.view; nav(); go(CURRENT); };
      });
    }
    const VIEWS = { overview: viewOverview, students: viewStudents, handoffs: viewHandoffs,
      "handoff-new": viewHandoffNew, avoidance: viewAvoidance, inject: viewInject,
      fidelity: viewFidelity, phases: viewPhases, assign: viewAssign,
      assessments: viewAssessments, export: viewExport,
      weekly: viewWeekly, notifications: viewNotifications,
      native: viewNative, assignments: viewAssignments,
      dictation: viewDictation, writings: viewWritings, account: viewAccount };
    function go(v) { VIEWS[v] ? VIEWS[v]() : viewOverview(); }

    /* ---------- 改密码 ---------- */
    function viewAccount() {
      const el = document.getElementById("view");
      el.innerHTML = `
        <h1>🔑 修改教师密码</h1>
        <div class="card" style="max-width:420px">
          <p class="muted">密码至少 8 位。改完后这台设备会自动改用新密码，其他设备需要重新登录。</p>
          <div style="margin-bottom:10px"><label class="muted" style="display:block">新密码</label>
            <input id="pw1" type="password" autocomplete="new-password" style="width:100%;padding:9px"></div>
          <div style="margin-bottom:14px"><label class="muted" style="display:block">再输一次</label>
            <input id="pw2" type="password" autocomplete="new-password" style="width:100%;padding:9px"></div>
          <button class="btn-primary" id="btn-pw" style="width:100%;padding:11px">保存</button>
        </div>`;
      document.getElementById("btn-pw").onclick = async () => {
        const p1 = document.getElementById("pw1").value.trim();
        const p2 = document.getElementById("pw2").value.trim();
        if (p1.length < 8) return alert("密码至少 8 位");
        if (p1 !== p2) return alert("两次输入不一致");
        await api("/teacher/password", { method: "POST", body: JSON.stringify({ new_password: p1 }) });
        localStorage.setItem(TOKEN_KEY, p1);
        alert("密码已修改");
      };
    }

    /* ---------- 1 班级总览 ---------- */
    async function viewOverview() {
      const el = document.getElementById("view");
      const d = await api("/teacher/overview");
      const rows = d.classes.map(c => `
        <tr><td><b>${esc(c.class_id)}</b></td><td><span class="tag">${esc(c.phase)}</span></td>
        <td>${c.n_students}</td><td>${c.active_7d}</td><td>${c.weekly_interactions}</td>
        <td>${c.open_handoffs ? `<span class="tag tag-open">${c.open_handoffs} 未闭环</span>` : "—"}</td></tr>`).join("");
      el.innerHTML = `
        <h1>📊 班级总览</h1>
        <div class="stat-grid">
          <div class="stat"><div class="num">${d.open_handoffs_total}</div><div class="lbl">未闭环交接</div></div>
          <div class="stat"><div class="num">${d.open_avoidance}</div><div class="lbl">回避预警</div></div>
        </div>
        <div class="card"><h2>各班级状态</h2>
        <table><tr><th>班级</th><th>阶段</th><th>学生数</th><th>7日活跃</th><th>7日交互</th><th>未闭环交接</th></tr>${rows}</table></div>`;
    }

    /* ---------- 2 学生行为明细 ---------- */
    async function viewStudents() {
      const el = document.getElementById("view");
      const students = (await api("/teacher/data")).students;
      const opts = students.map(s => `<option value="${s.id}">${esc(s.display_name)} (${esc(s.class_id)})</option>`).join("");
      el.innerHTML = `
        <h1>👤 学生行为明细</h1>
        <div class="card"><div class="row">
          <select id="sel-stu">${opts}</select>
          <select id="sel-phase"><option value="">全部阶段</option><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="T1">T1</option><option value="T2">T2</option></select>
          <button class="btn-primary" id="btn-load">查看</button>
        </div><div id="stu-result"></div></div>`;
      document.getElementById("btn-load").onclick = async () => {
        const sid = document.getElementById("sel-stu").value;
        const phase = document.getElementById("sel-phase").value;
        const d = await api(`/teacher/student_detail?student_id=${sid}&phase=${phase}`);
        const hintRows = Object.entries(d.hints_by_level).map(([k, v]) => `<td>${k}级:${v}</td>`).join("");
        document.getElementById("stu-result").innerHTML = `
          <div class="stat-grid">
            <div class="stat"><div class="num">${d.sessions}</div><div class="lbl">会话数</div></div>
            <div class="stat"><div class="num">${d.submits}</div><div class="lbl">提交数</div></div>
            <div class="stat"><div class="num">${d.followup_count}</div><div class="lbl">主动追问</div></div>
            <div class="stat"><div class="num">${d.adoption_rate == null ? "—" : d.adoption_rate + "%"}</div><div class="lbl">反馈采纳率</div></div>
          </div>
          <div class="card"><h2>提示依赖分布</h2><table><tr><th>等级</th><th>次数</th></tr>${hintRows || "<tr><td>—</td><td>无</td></tr>"}</table></div>
          <div class="card"><h2>反馈决策理由</h2>
            ${Object.keys(d.decisions || {}).length
              ? `<table><tr><th>学生的选择</th><th>次数</th></tr>${Object.entries(d.decisions).map(([k, v]) => `<tr><td>${esc((d.decision_labels || {})[k] || k)}</td><td>${v}</td></tr>`).join("")}</table>`
              : "<p class='muted'>该生尚未提交反馈决策理由</p>"}
          </div>`;
      };
    }

    /* ---------- 3 交接事件队列 ---------- */
    async function viewHandoffs() {
      const el = document.getElementById("view");
      const d = await api("/teacher/handoffs?open_only=0");
      const rows = d.handoffs.map(h => `
        <tr>
          <td>${esc(h.timestamp)}</td><td>${esc(h.display_name || h.student_id)}</td><td>${esc(h.class_id || "")}</td>
          <td><span class="tag ${h.closed ? "tag-closed" : "tag-open"}">${esc(h.t_type)}</span></td>
          <td class="wrap">${esc(h.trigger || "")}</td>
          <td class="wrap">${esc(h.ai_action || "")}</td>
          <td class="wrap">${esc(h.teacher_action || "")}</td>
          <td>${h.closed ? '<span class="tag tag-closed">已闭环</span>' : `<button class="btn-primary btn-sm" data-id="${h.id}" data-act="respond">响应</button>`}</td>
        </tr>`).join("");
      el.innerHTML = `
        <h1>🔁 交接事件队列 <button class="btn-primary btn-sm" id="btn-refresh" style="margin-left:8px">刷新</button></h1>
        <div class="card"><table><tr><th>时间</th><th>学生</th><th>班</th><th>T类</th><th>触发</th><th>AI动作</th><th>教师动作</th><th>状态</th></tr>${rows || "<tr><td colspan=8>无记录</td></tr>"}</table></div>
        <div id="respond-box"></div>`;
      document.getElementById("btn-refresh").onclick = viewHandoffs;
      el.querySelectorAll("[data-act=respond]").forEach(b => {
        b.onclick = async () => {
          const hid = b.dataset.id;
          document.getElementById("respond-box").innerHTML = `
            <div class="card"><h2>响应交接 #${hid}</h2>
            <textarea id="resp-action" placeholder="教师动作描述"></textarea>
            <div class="row"><button class="btn-primary" id="btn-close">标记闭环</button>
            <button class="btn-sm" id="btn-keep">仅记录不闭环</button></div></div>`;
          document.getElementById("btn-close").onclick = async () => {
            await api(`/teacher/handoff/${hid}/respond`, { method: "POST", body: JSON.stringify({ teacher_action: document.getElementById("resp-action").value, closed: true }) });
            viewHandoffs(); updateBadge();
          };
          document.getElementById("btn-keep").onclick = async () => {
            await api(`/teacher/handoff/${hid}/respond`, { method: "POST", body: JSON.stringify({ teacher_action: document.getElementById("resp-action").value, closed: false }) });
            viewHandoffs();
          };
        };
      });
    }

    /* ---------- 4 交接手动补录 ---------- */
    async function viewHandoffNew() {
      const el = document.getElementById("view");
      const students = (await api("/teacher/data")).students;
      const opts = students.map(s => `<option value="${s.id}">${esc(s.display_name)} (${esc(s.class_id)})</option>`).join("");
      el.innerHTML = `
        <h1>➕ 交接事件手动补录</h1>
        <div class="card">
          <label>学生</label><select id="h-stu">${opts}</select>
          <label>T 类</label><select id="h-type">
            <option value="T1">T1 求助升级</option><option value="T2">T2 反馈授权</option>
            <option value="T3">T3 情感响应</option><option value="T4">T4 反向交接</option></select>
          <label>触发线索</label><input id="h-trigger" placeholder="如：学生第2点反馈不采纳">
          <label>AI 动作</label><input id="h-ai" placeholder="如：AI给出语法反馈">
          <label>教师动作</label><textarea id="h-teacher" placeholder="如：组织审读，学生说明理由"></textarea>
          <button class="btn-primary" id="h-submit">保存</button>
        </div>`;
      document.getElementById("h-submit").onclick = async () => {
        const student = document.getElementById("h-stu").value;
        await api("/teacher/handoff", { method: "POST", body: JSON.stringify({
          student_id: parseInt(student), t_type: document.getElementById("h-type").value,
          trigger: document.getElementById("h-trigger").value, ai_action: document.getElementById("h-ai").value,
          teacher_action: document.getElementById("h-teacher").value, source: "manual_teacher" }) });
        alert("已保存"); viewHandoffNew();
      };
    }

    /* ---------- 5 回避预警 ---------- */
    async function viewAvoidance() {
      const el = document.getElementById("view");
      const d = await api("/teacher/avoidance?resolved=0");
      const rows = d.flags.map(f => `
        <tr><td>${esc(f.triggered_at)}</td><td>${esc(f.display_name)}</td><td>${esc(f.class_id)}</td>
        <td>${esc((d.flag_labels[f.flag_type] || f.flag_type))}</td>
        <td><button class="btn-primary btn-sm" data-id="${f.id}">已接触</button></td></tr>`).join("");
      el.innerHTML = `
        <h1>⚠️ 回避预警 <button class="btn-primary btn-sm" id="btn-scan" style="margin-left:8px">立即扫描</button></h1>
        <div class="card"><table><tr><th>触发时间</th><th>学生</th><th>班</th><th>类型</th><th>处理</th></tr>${rows || "<tr><td colspan=5>当前无未解决预警</td></tr>"}</table></div>`;
      document.getElementById("btn-scan").onclick = async () => {
        const r = await api("/teacher/avoidance/scan", { method: "POST" });
        alert("扫描完成，新增 " + r.created.length + " 条"); viewAvoidance(); updateBadge();
      };
      el.querySelectorAll("[data-id]").forEach(b => {
        b.onclick = async () => { await api(`/teacher/avoidance/${b.dataset.id}/resolve`, { method: "POST" }); viewAvoidance(); };
      });
    }

    /* ---------- 6 T4 练习注入 ---------- */
    async function viewInject() {
      const el = document.getElementById("view");
      const d = await api("/teacher/data");
      const opts = d.classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>💉 T4 练习注入</h1>
        <div class="card">
          <label>目标班级</label><select id="i-class">${opts}</select>
          <label>共性形式问题 / 注入内容</label><textarea id="i-content" placeholder="如：全班 zh/ch/sh 混淆普遍，注入针对性辨音练习"></textarea>
          <button class="btn-primary" id="i-submit">注入</button>
        </div>`;
      document.getElementById("i-submit").onclick = async () => {
        await api("/teacher/inject", { method: "POST", body: JSON.stringify({
          class_id: document.getElementById("i-class").value, content: document.getElementById("i-content").value }) });
        alert("已注入并留痕"); viewInject(); updateBadge();
      };
    }

    /* ---------- 7 保真度自评清单 ---------- */
    async function viewFidelity() {
      const el = document.getElementById("view");
      const classes = (await api("/teacher/data")).classes;
      const classOpts = classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>📋 保真度自评清单</h1>
        <div class="card"><div class="row">
          <select id="f-class">${classOpts}</select>
          <select id="f-phase"><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="T1">T1</option><option value="T2">T2</option></select>
          <input id="f-date" type="date">
          <button class="btn-primary" id="f-load">加载清单</button>
        </div><div id="f-body"></div></div>`;
      document.getElementById("f-load").onclick = async () => {

              <div style="max-height:320px;overflow:auto;white-space:pre-wrap;background:#fafafa;padding:12px;border-radius:8px;line-height:1.9">${esc(w.content || "")}</div>
              ${w.ai_feedback ? `<div class="muted" style="margin-top:10px">AI 总评：${esc(w.ai_feedback.overall || "")}</div>` : ""}
              <h2 style="margin-top:16px">教师评分（满分 50）</h2>
              <div class="row">
                <label>内容(15) <input id="rv-1" type="number" min="0" max="15" value="${ai["内容"] != null ? ai["内容"] : ""}"></label>
                <label>结构(15) <input id="rv-2" type="number" min="0" max="15" value="${ai["结构"] != null ? ai["结构"] : ""}"></label>
                <label>语言(15) <input id="rv-3" type="number" min="0" max="15" value="${ai["语言"] != null ? ai["语言"] : ""}"></label>
                <label>规范(5) <input id="rv-4" type="number" min="0" max="5" value="${ai["规范"] != null ? ai["规范"] : ""}"></label>
              </div>
              <textarea id="rv-comment" placeholder="教师评语">${esc(w.teacher_comment || "")}</textarea>
              <button class="btn-primary" id="rv-save">保存终评</button>
            </div>`;
          document.getElementById("rv-save").onclick = async () => {
            const v = id => parseFloat(document.getElementById(id).value) || 0;
            const scores = { "内容": v("rv-1"), "结构": v("rv-2"), "语言": v("rv-3"), "规范": v("rv-4") };
            scores["总分"] = scores["内容"] + scores["结构"] + scores["语言"] + scores["规范"];
            await api("/teacher/writing/review", { method: "POST", body: JSON.stringify({
              submission_id: w.id, scores, comment: document.getElementById("rv-comment").value,
            }) });
            alert("已保存终评"); viewWritings();
          };
        };
      });
    }

    /* ---------- 10 数据导出 ---------- */
    async function viewExport() {
      const el = document.getElementById("view");
      const tables = ["logs", "students", "phase_config", "hint_events", "feedback_events", "avoidance_flags",
        "handoff_events", "teacher_actions", "fidelity_checklists", "assessments", "oral_samples",
        "assignments", "assignment_submissions", "dictation_events", "recitation_events",
        "writing_submissions", "writing_revisions", "reading_logs", "error_items"];
      const classes = (await api("/teacher/data")).classes;
      const classOpts = `<option value="">全部</option>` + classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>⬇ 数据导出</h1>
        <div class="card"><div class="row">
          <select id="e-table">${tables.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
          <select id="e-class">${classOpts}</select>
          <input id="e-from" type="date" placeholder="开始"> <input id="e-to" type="date" placeholder="结束">
          <button class="btn-primary" id="e-go">导出 CSV</button>
        </div><p class="muted">UTF-8 带 BOM，可直接进 Excel/SPSS/R；导出会留痕。</p></div>`;
      document.getElementById("e-go").onclick = async () => {
        const t = document.getElementById("e-table").value;
        const q = new URLSearchParams({ table: t });
        const c = document.getElementById("e-class").value; if (c) q.set("class_id", c);
        const f = document.getElementById("e-from").value; if (f) q.set("from_", f);
        const t2 = document.getElementById("e-to").value; if (t2) q.set("to", t2);
        const r = await fetch("/teacher/export2?" + q.toString(), { headers: { "X-Teacher-Token": localStorage.getItem(TOKEN_KEY) } });
        const blob = await r.blob();
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t + "_export.csv"; a.click();
        updateBadge();
      };
    }
  </script>
