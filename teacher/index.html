<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>教师端 · 中文教学台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
           background: #f4f6f5; color: #22332c; }
    h1 { font-size: 1.3rem; } h2 { font-size: 1.05rem; margin: 4px 0 10px; }
    .muted { color: #6d7f77; font-size: 0.85rem; margin-bottom: 10px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px;
            box-shadow: 0 1px 6px rgba(34,51,44,.08); }
    table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
    th, td { border-bottom: 1px solid #e4ebe7; padding: 6px 8px; text-align: left; white-space: nowrap; }
    th { background: #eef4f1; position: sticky; top: 0; }
    td.wrap { white-space: normal; max-width: 300px; }
    button, select, input, textarea { padding: 8px 11px; border-radius: 9px; border: 1px solid #cfdad4;
            font-size: 0.9rem; cursor: pointer; font-family: inherit; background: #fff; }
    textarea { width: 100%; min-height: 70px; }
    .btn-primary { background: #1f8a5f; color: #fff; border: none; }
    .btn-sm { padding: 5px 9px; font-size: 0.8rem; }
    .link-btn { background: none; border: none; color: #1f8a5f; font-size: .85rem;
                padding: 0; cursor: pointer; text-decoration: underline; }
    .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.75rem; }
    .tag-open { background: #fbe3e0; color: #a33b2e; } .tag-closed { background: #dcf2e6; color: #14603f; }
    .badge { background: #c0392b; color: #fff; border-radius: 999px; padding: 1px 7px; font-size: 0.75rem; }
    .notif-row { padding: 10px 12px; border-bottom: 1px solid #e6f0eb; border-left: 4px solid transparent; }
    .notif-row.unread { background: #ecf6f0; border-left-color: #1f8a5f; cursor: pointer; }
    .notif-row .nr-kind { font-size: 0.72rem; color: #1f8a5f; font-weight: 700; letter-spacing: .05em; }
    .notif-row .nr-title { font-weight: 700; margin-top: 2px; }
    .notif-row .nr-body { font-size: 0.85rem; color: #415c52; margin-top: 2px; }
    .notif-row .nr-time { font-size: 0.72rem; color: #6b8579; margin-top: 4px; }
    #login { max-width: 380px; margin: 80px auto; }
    .layout { display: flex; min-height: 100vh; }
    .sidenav { width: 180px; background: #22332c; color: #dfeae4; padding: 14px 8px; flex-shrink: 0; }
    .sidenav h3 { font-size: 0.95rem; margin-bottom: 10px; padding: 0 8px; }
    .nav-group { font-size: 0.7rem; color: #8aa79b; padding: 12px 10px 4px; letter-spacing: .08em; }
    .nav-item { display: block; width: 100%; text-align: left; background: none; border: none; color: #cfe0d8;
                padding: 9px 10px; border-radius: 8px; margin-bottom: 2px; font-size: 0.85rem; cursor: pointer; }
    .nav-item:hover { background: #2e463c; }
    .nav-item.active { background: #1f8a5f; color: #fff; }
    #view { flex: 1; padding: 18px; overflow-x: auto; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 10px; margin-bottom: 14px; }
    .stat { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 1px 6px rgba(34,51,44,.08); }
    .stat .num { font-size: 1.6rem; font-weight: 700; color: #1f8a5f; }
    .stat .lbl { font-size: 0.8rem; color: #6d7f77; }
    .stat .hint { font-size: .72rem; color: #8a9b93; margin-top: 2px; }
    .check-item { display: block; padding: 8px 0; border-bottom: 1px solid #eef4f1; }
    .error-text { color: #a3541f; font-size: 0.85rem; margin-top: 8px; }
    .todo { display: flex; justify-content: space-between; align-items: center; gap: 12px;
            padding: 10px 0; border-bottom: 1px solid #eef4f1; }
    .todo:last-child { border-bottom: none; }
    .todo .t-main { flex: 1; }
    .todo .t-title { font-weight: 600; font-size: .93rem; }
    .todo .t-sub { font-size: .78rem; color: #6d7f77; margin-top: 2px; }
    .todo .t-num { font-size: 1.15rem; font-weight: 700; color: #a33b2e; white-space: nowrap; }
    .todo .t-num.zero { color: #1f8a5f; }
    .help-box { background: #eef4f1; border-left: 4px solid #1f8a5f; border-radius: 8px;
                padding: 10px 12px; font-size: .85rem; line-height: 1.8; margin-bottom: 12px; }
    .help-box b { color: #14603f; }
    .term { padding: 9px 0; border-bottom: 1px dashed #dfe8e3; font-size: .9rem; line-height: 1.75; }
    .term:last-child { border-bottom: none; }
    .term b { display: inline-block; min-width: 88px; color: #14603f; }

    /* ---------- 手机端适配 ---------- */
    @media (max-width: 760px) {
      .layout { flex-direction: column; min-height: auto; }
      .sidenav { width: 100%; display: flex; gap: 6px; overflow-x: auto;
                 padding: 8px 10px; position: sticky; top: 0; z-index: 20;
                 -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .sidenav::-webkit-scrollbar { display: none; }
      .sidenav h3, .nav-group { display: none; }
      .nav-item { display: inline-block; width: auto; flex: 0 0 auto;
                  white-space: nowrap; margin-bottom: 0; padding: 8px 12px; }
      #research-nav { display: inline-flex; gap: 6px; }
      #view { padding: 12px; }
      h1 { font-size: 1.15rem; }
      .card { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      th { position: static; }
      th, td { padding: 6px 7px; }
      td.wrap { max-width: 170px; }
      .stat-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
      .row { gap: 6px; }
      button, select, input, textarea { font-size: 0.85rem; }
      #login { margin: 40px 16px; }
    }
  </style>
</head>
<body>
  <div id="login" class="card">
    <h2>🔒 教师登录</h2>
    <p class="muted">密码 = 后端环境变量 TEACHER_PASSWORD</p>
    <input type="password" id="pwd" placeholder="密码" style="width:100%">
    <button class="btn-primary" id="btn-login" style="margin-top:10px;width:100%;padding:12px">登录</button>
  </div>
  <div id="app" style="display:none">
    <div class="layout">
      <nav class="sidenav">
        <h3>🎓 中文教学台</h3>
        <div class="nav-group">日常教学</div>
        <button class="nav-item active" data-view="dashboard">🏠 今日工作台</button>
        <button class="nav-item" data-view="classinfo">🀄 班级学情</button>
        <button class="nav-item" data-view="students">👤 学生档案</button>
        <button class="nav-item" data-view="writings">✍️ 习作批改<span id="writing-badge"></span></button>
        <button class="nav-item" data-view="homework">📝 作业管理</button>
        <button class="nav-item" data-view="content">📚 课程与内容</button>
        <div class="nav-group">记录与数据</div>
        <button class="nav-item" data-view="weekly">📈 班级周报</button>
        <button class="nav-item" data-view="notifications">🔔 通知中心<span id="notif-badge"></span></button>
        <button class="nav-item" data-view="export">⬇ 数据导出</button>
        <div class="nav-group">系统</div>
        <button class="nav-item" data-view="help">❓ 使用说明</button>
        <button class="nav-item" data-view="account">🔑 改密码</button>
        <button class="nav-item" id="btn-logout">🚪 退出</button>
        <div class="nav-group">研究实验（L2）</div>
        <button class="nav-item" id="nav-research">🔬 研究工具（点击展开）</button>
        <div id="research-nav" style="display:none">
          <button class="nav-item" data-view="handoffs">🔁 求助与交接<span id="handoff-badge"></span></button>
          <button class="nav-item" data-view="handoff-new">➕ 交接补录</button>
          <button class="nav-item" data-view="avoidance">⚠️ 回避预警</button>
          <button class="nav-item" data-view="inject">💉 T4 注入</button>
          <button class="nav-item" data-view="fidelity">📋 保真度</button>
          <button class="nav-item" data-view="phases">🔄 阶段管理</button>
        </div>
      </nav>
      <main id="view"></main>
    </div>
  </div>

  <script>
    const TOKEN_KEY = "teacher_token";
    const CLASS_KEY = "teacher_class";
    const VIEW_KEY = "teacher_view";
    const RESEARCH_VIEWS = ["handoffs", "handoff-new", "avoidance", "inject", "fidelity", "phases"];
    const VIEWS = { dashboard: viewDashboard, classinfo: viewClassInfo, students: viewStudents,
      writings: viewWritings, homework: viewHomework, content: viewContent,
      weekly: viewWeekly, notifications: viewNotifications, export: viewExport,
      help: viewHelp, account: viewAccount,
      handoffs: viewHandoffs, "handoff-new": viewHandoffNew, avoidance: viewAvoidance,
      inject: viewInject, fidelity: viewFidelity, phases: viewPhases };
    let CURRENT = localStorage.getItem(VIEW_KEY) || "dashboard";
    if (!VIEWS[CURRENT]) CURRENT = "dashboard";
    let CLASS = localStorage.getItem(CLASS_KEY) || "C6/1";
    let CLASSES = [];

    document.getElementById("btn-login").onclick = async () => {
      const pwd = document.getElementById("pwd").value;
      const r = await fetch("/teacher/overview", { headers: { "X-Teacher-Token": pwd } });
      if (r.status !== 200) { alert("密码错误"); return; }
      localStorage.setItem(TOKEN_KEY, pwd);
      showApp();
    };
    document.getElementById("btn-logout").onclick = () => {
      localStorage.removeItem(TOKEN_KEY); location.reload();
    };
    (async () => {
      const saved = localStorage.getItem(TOKEN_KEY);
      if (!saved) return;
      const r = await fetch("/teacher/overview", { headers: { "X-Teacher-Token": saved } });
      if (r.status !== 200) return;
      showApp();
    })();

    async function showApp() {
      document.getElementById("login").style.display = "none";
      document.getElementById("app").style.display = "block";
      await loadClasses();
      nav();
      go(CURRENT);
      updateBadge();
    }
    async function api(path, opts = {}) {
      const r = await fetch(path, { ...opts,
        headers: { "Content-Type": "application/json", "X-Teacher-Token": localStorage.getItem(TOKEN_KEY), ...(opts.headers || {}) } });
      if (r.status === 401) { alert("会话过期"); location.reload(); throw new Error("401"); }
      if (!r.ok) { const t = await r.text(); throw new Error(t || "请求失败"); }
      return r.json();
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]); }
    function q(s) { return encodeURIComponent(s); }
    function clsParams(extra = {}) { return new URLSearchParams({ class_id: CLASS, ...extra }).toString(); }
    function classLabel(id) {
      const c = CLASSES.find(x => x.class_id === id);
      return c ? (c.label || id) : id;
    }
    function classOptions() {
      return CLASSES.map(c => `<option value="${esc(c.class_id)}" ${c.class_id === CLASS ? "selected" : ""}>${esc(c.label || c.class_id)}${c.n_students ? ` · ${c.n_students}人` : ""}</option>`).join("");
    }
    async function loadClasses() {
      try { CLASSES = (await api("/teacher/overview")).classes; } catch (e) { CLASSES = []; }
      if (CLASSES.length && !CLASSES.some(c => c.class_id === CLASS)) {
        CLASS = (CLASSES.find(c => c.n_students) || CLASSES[0]).class_id;
        localStorage.setItem(CLASS_KEY, CLASS);
      }
    }
    async function updateBadge() {
      try {
        const d = await api("/teacher/overview");
        const b = document.getElementById("handoff-badge");
        if (b) b.innerHTML = d.open_handoffs_total ? `<span class="badge">${d.open_handoffs_total}</span>` : "";
        const nb = document.getElementById("notif-badge");
        if (nb) nb.innerHTML = d.unread_notifications ? `<span class="badge">${d.unread_notifications}</span>` : "";
        const wb = document.getElementById("writing-badge");
        if (wb) {
          try {
            const w = await api("/teacher/writings?" + clsParams());
            const pending = w.writings.filter(x => x.status !== "teacher_reviewed" && x.status !== "draft").length;
            wb.innerHTML = pending ? `<span class="badge">${pending}</span>` : "";
          } catch (e) {}
        }
      } catch (e) {}
    }
    function nav() {
      const researchOpen = RESEARCH_VIEWS.includes(CURRENT);
      const box = document.getElementById("research-nav");
      box.style.display = researchOpen ? "block" : "none";
      document.getElementById("nav-research").classList.toggle("active", researchOpen);
      document.querySelectorAll(".nav-item[data-view]").forEach(b => {
        b.classList.toggle("active", b.dataset.view === CURRENT);
        b.onclick = () => {
          CURRENT = b.dataset.view;
          localStorage.setItem(VIEW_KEY, CURRENT);
          nav(); go(CURRENT);
        };
      });
    }
    document.getElementById("nav-research").onclick = () => {
      const box = document.getElementById("research-nav");
      const opening = box.style.display === "none" || !box.style.display;
      box.style.display = opening ? "block" : "none";
      document.getElementById("nav-research").classList.toggle("active", opening);
    };
    function go(v) { (VIEWS[v] || viewDashboard)(); }

    function classPicker() { return `<select id="class-picker">${classOptions()}</select>`; }
    function bindClassPicker(el, rerender) {
      const sel = el.querySelector("#class-picker");
      if (!sel) return;
      sel.onchange = () => {
        CLASS = sel.value;
        localStorage.setItem(CLASS_KEY, CLASS);
        rerender();
      };
    }

    /* ---------- 使用说明 ---------- */
    function viewHelp() {
      const el = document.getElementById("view");
      el.innerHTML = `
        <h1>❓ 教师端使用说明</h1>
        <div class="card">
          <h2>老师每天怎么用（约 3 分钟）</h2>
          <div class="term"><b>① 看</b>「今日工作台」的红字：作文待批、作业未交、求助未处理，有几项就处理几项。</div>
          <div class="term"><b>② 批</b>进「习作批改」，AI 已经打过分、写过总评，你只需要核对、改分、写一句评语，保存终评。</div>
          <div class="term"><b>③ 教</b>进「班级学情」，看全班错得最多的字词和知识点，下一节课就讲这些；需要巩固就在「作业管理」布置听写或练习。</div>
          <div class="term"><b>④ 留痕</b>学生卡住时系统会生成一条「求助与交接」，你回应后点「完成」，这件事就算结束、有记录可查。</div>
        </div>
        <div class="card">
          <h2>「闭环」是什么意思</h2>
          <div class="help-box">
            闭环 = <b>一件事从被发现，到有人处理，再到有结果可查，走完一整圈</b>。<br>
            只发现问题、没人处理，叫「没闭环」；处理完了并记下来，才叫「已闭环」。<br><br>
            <b>本系统里的例子：</b>学生做题卡住 → 系统生成一条求助（交接）→ 你在「求助与交接」里写处理办法并点「完成」→ 这条求助变成<span class="tag tag-closed">已闭环</span>。<br>
            系统默认给 48 小时处理时间，超过就算「逾期未闭环」，会在工作台和周报里提醒你。
          </div>
          <h2 style="margin-top:14px">教学上的闭环</h2>
          <div class="help-box">
            指完整的教学回路：<b>预习 → 上课 → 作业 → 批改 → 测验 → 根据错题再讲</b>。错题本和班级学情就是把最后一环接回第一环——学生错什么，下一节课就补什么。
          </div>
        </div>
        <div class="card">
          <h2>每个板块做什么</h2>
          <div class="term"><b>今日工作台</b>今天要处理的事，按数量排序。</div>
          <div class="term"><b>班级学情</b>全班听写、作业、作文、错题概况，找教学重点。</div>
          <div class="term"><b>学生档案</b>单个学生的练习、错题、作文、活跃情况。</div>
          <div class="term"><b>习作批改</b>学生提交的作文，AI 初评 + 教师终评。</div>
          <div class="term"><b>作业管理</b>布置听写/练习/习作/背诵，查看谁交了谁没交。</div>
          <div class="term"><b>课程与内容</b>本班教材有哪些单元、语文园地、习作，以及已开放给学生的课文。</div>
          <div class="term"><b>班级周报</b>一周汇总，含需要关注的学生。</div>
          <div class="term"><b>通知中心</b>系统自动提醒（预警、交接、阶段提醒）。</div>
          <div class="term"><b>研究工具</b>L2 研究阶段专用的交接、预警、保真度、阶段控制，日常教学可以不管。</div>
        </div>`;
    }

    /* ---------- 改密码 ---------- */
    function viewAccount() {
      const el = document.getElementById("view");
      el.innerHTML = `
        <h1>🔑 修改教师密码</h1>
        <div class="card" style="max-width:420px">
          <p class="muted">密码至少 8 位。改完后这台设备会自动改用新密码，其他设备需要重新登录。</p>
          <div style="margin-bottom:10px"><label class="muted" style="display:block">新密码</label>
            <input id="pw1" type="password" autocomplete="new-password" style="width:100%;padding:9px"></div>
          <div style="margin-bottom:14px"><label class="muted" style="display:block">再输一次</label>
            <input id="pw2" type="password" autocomplete="new-password" style="width:100%;padding:9px"></div>
          <button class="btn-primary" id="btn-pw" style="width:100%;padding:11px">保存</button>
        </div>`;
      document.getElementById("btn-pw").onclick = async () => {
        const p1 = document.getElementById("pw1").value.trim();
        const p2 = document.getElementById("pw2").value.trim();
        if (p1.length < 8) return alert("密码至少 8 位");
        if (p1 !== p2) return alert("两次输入不一致");
        await api("/teacher/password", { method: "POST", body: JSON.stringify({ new_password: p1 }) });
        localStorage.setItem(TOKEN_KEY, p1);
        alert("密码已修改");
      };
    }

    /* ---------- 1 今日工作台 ---------- */
    async function viewDashboard() {
      const el = document.getElementById("view");
      el.innerHTML = `<h1>🏠 今日工作台</h1><div class="card muted">加载中…</div>`;
      let ov, nat, wr, asg, dic, errs, av;
      try {
        [ov, nat, wr, asg, dic, errs, av] = await Promise.all([
          api("/teacher/overview"),
          api("/teacher/native_overview?" + clsParams()),
          api("/teacher/writings?" + clsParams()),
          api("/teacher/assignments?" + clsParams()),
          api("/teacher/dictation?" + clsParams()),
          api("/teacher/errors?" + clsParams()),
          api("/teacher/avoidance?resolved=0"),
        ]);
      } catch (e) {
        el.innerHTML = `<h1>🏠 今日工作台</h1><div class="card">加载失败：${esc(e.message)}</div>`;
        return;
      }
      CLASSES = ov.classes;
      const c = ov.classes.find(x => x.class_id === CLASS) || {};
      const pendingW = wr.writings.filter(x => x.status !== "teacher_reviewed" && x.status !== "draft").length;
      const pendingHw = asg.assignments.reduce((n, a) => n + Math.max(0, (a.n_students || 0) - (a.n_done || 0)), 0);
      const alerts = (av.flags || []).filter(f => f.class_id === CLASS);
      const topTag = (errs.tags || [])[0];
      const students = nat.students || [];
      const inactive = students.filter(s => !s.last_active ||
        (Date.now() - new Date(s.last_active.replace(" ", "T") + "Z").getTime()) > 7 * 864e5);
      const todo = (n, title, sub, view) => `
        <div class="todo">
          <div class="t-main"><div class="t-title">${esc(title)}</div><div class="t-sub">${esc(sub)}</div></div>
          <div class="t-num ${n ? "" : "zero"}">${n}</div>
          <button class="link-btn" data-goto="${view}">去处理 →</button>
        </div>`;
      el.innerHTML = `
        <div class="row" style="justify-content:space-between">
          <h1>🏠 今日工作台</h1>
          ${classPicker()}
        </div>
        <p class="muted">当前班级：${esc(c.label || CLASS)} · 阶段 ${esc(c.phase || "—")}</p>
        <div class="stat-grid">
          <div class="stat"><div class="num">${c.n_students || 0}</div><div class="lbl">学生数</div></div>
          <div class="stat"><div class="num">${c.active_7d || 0}</div><div class="lbl">近 7 天活跃</div></div>
          <div class="stat"><div class="num">${pendingW}</div><div class="lbl">作文待批</div></div>
          <div class="stat"><div class="num">${pendingHw}</div><div class="lbl">作业未交人次</div></div>
          <div class="stat"><div class="num">${dic.week.accuracy == null ? "—" : dic.week.accuracy + "%"}</div><div class="lbl">近 7 天听写正确率</div></div>
          <div class="stat"><div class="num">${c.open_handoffs || 0}</div><div class="lbl">待处理求助（未闭环）</div><div class="hint">48 小时内要回应</div></div>
        </div>
        <div class="card"><h2>今天要处理的</h2>
          ${todo(pendingW, "作文待批", "AI 已初评，等你核对后保存终评", "writings")}

              ? "单元页 → 课文（生词 / 课文 / 语法 / 练习 / 测验）→ 单元复习（词汇与句型 / 单元练习 / 文化小知识）→ 写作（写法指导 / 好词好句 / 范文）→ 单元测验"
              : "课程列表 → 课文（生词 / 课文 / 语法 / 练习 / 测验）→ 作业")}</p>
        </div>
        ${cm.native ? `<div class="help-box">中文班是常规教学，全部课文和单元内容默认开放给学生，不需要逐课分配。下面的「开放给学生的课文」只用于 L2 研究班。</div>` : `<div class="card"><h2>开放给学生的课文</h2>
          <p class="muted">勾选后该班学生才能看到对应课程。保存会整体替换该班分配。</p>
          <div id="a-body">
            ${la.lessons.map(l => `<label class="check-item"><input type="checkbox" class="a-chk" value="${l.lesson_no}" ${l.assigned ? "checked" : ""}> 第${l.lesson_no}课 ${esc(l.title)}</label>`).join("") || '<p class="muted">该教材没有课文数据</p>'}
          </div>
          <div class="row" style="margin-top:12px">
            <button class="btn-sm" id="a-all">全选</button>
            <button class="btn-sm" id="a-none">清空</button>
            <button class="btn-primary" id="a-save">保存分配</button>
          </div>
        </div>`}`;
      if (!cm.native) {
        document.getElementById("a-all").onclick = () => el.querySelectorAll(".a-chk").forEach(x => x.checked = true);
        document.getElementById("a-none").onclick = () => el.querySelectorAll(".a-chk").forEach(x => x.checked = false);
        document.getElementById("a-save").onclick = async () => {
          const lessons = [...el.querySelectorAll(".a-chk:checked")].map(x => x.value);
          await api("/teacher/lesson_assign", { method: "POST", body: JSON.stringify({ class_id: CLASS, lessons }) });
          alert("已保存，开放 " + lessons.length + " 课"); viewContent();
        };
      }
      bindClassPicker(el, viewContent);
    }

    /* ---------- 7 班级周报 ---------- */
    async function viewWeekly() {
      const el = document.getElementById("view");
      const d = await api("/teacher/weekly_report");
      const rows = d.classes.map(c => `
        <tr>
          <td><b>${esc(c.class_id)}</b></td>
          <td><span class="tag">${esc(c.phase)}</span></td>
          <td>${c.phase_days == null ? "—" : c.phase_days + " 天"}</td>
          <td>${c.n_students}</td>
          <td>${c.handoffs_total}${c.close_rate == null ? "" : ` <span class="muted">(${c.close_rate}% 闭环)</span>`}</td>
          <td>${c.flags_new} 新增 / ${c.flags_open} 未解决</td>
          <td class="wrap">${c.watch.length ? c.watch.map(w => `${esc(w.display_name)}（预警${w.flags}·提示${w.hints}）`).join("<br>") : "—"}</td>
        </tr>`).join("");
      el.innerHTML = `
        <h1>📈 班级周报</h1>
        <p class="muted">${esc(d.week_start)} ~ ${esc(d.week_end)}（泰国时区 UTC+7）</p>
        <div class="help-box"><b>闭环率</b>＝本周生成的求助中，已经处理完的比例。比例低说明学生卡住的问题积压了。</div>
        <div class="card"><table>
          <tr><th>班级</th><th>阶段</th><th>已持续</th><th>学生数</th><th>本周交接</th><th>回避预警</th><th>需关注 TOP3</th></tr>
          ${rows || '<tr><td colspan=7>无数据</td></tr>'}
        </table></div>
        ${d.pending_phase_reminders && d.pending_phase_reminders.length ? `<div class="card"><h2>⏰ 阶段切换提醒</h2>
          ${d.pending_phase_reminders.map(p => `<p>${esc(p[0])} · ${esc(p[1])} 阶段还有 <b>${p[2]}</b> 天结束，请检查下一阶段配置、准备保真度清单、确认学生端通知文案。</p>`).join("")}
        </div>` : ""}`;
    }

    /* ---------- 8 通知中心 ---------- */
    async function viewNotifications() {
      const el = document.getElementById("view");
      const d = await api("/teacher/notifications");
      el.innerHTML = `
        <h1>🔔 通知中心 <button class="btn-primary btn-sm" id="n-scan" style="margin-left:8px">立即扫描</button></h1>
        <p class="muted">回避预警 / 交接提醒 / 阶段提醒 / 学习鼓励。打开「今日工作台」时会自动扫描一次。</p>
        <div class="card">
          ${d.notifications.length ? d.notifications.map(n => `
            <div class="notif-row ${n.read ? "" : "unread"}" data-id="${n.id}">
              <div class="nr-kind">${esc(d.kind_labels[n.kind] || n.kind || "")}</div>
              <div class="nr-title">${esc(n.title || "")}</div>
              ${n.body ? `<div class="nr-body">${esc(n.body)}</div>` : ""}
              <div class="nr-time">${esc(n.created_at || "")}</div>
            </div>`).join("") : "<p class='muted'>暂无通知</p>"}
        </div>`;
      document.getElementById("n-scan").onclick = async () => {
        const r = await api("/teacher/scan", { method: "POST" });
        alert(`扫描完成\n新增回避预警：${r.avoidance}\n新增 T2 交接：${r.t2}\n动机提醒：${r.motivation}\n阶段提醒：${r.phase}`);
        viewNotifications(); updateBadge();
      };
      el.querySelectorAll(".notif-row.unread").forEach(row => {
        row.onclick = async () => {
          await api(`/teacher/notifications/${row.dataset.id}/read`, { method: "POST" });
          row.classList.remove("unread");
          updateBadge();
        };
      });
    }

    /* ---------- 9 数据导出 ---------- */
    async function viewExport() {
      const el = document.getElementById("view");
      const tables = ["logs", "students", "phase_config", "hint_events", "feedback_events", "avoidance_flags",
        "handoff_events", "teacher_actions", "fidelity_checklists", "assessments", "oral_samples",
        "assignments", "assignment_submissions", "dictation_events", "recitation_events",
        "writing_submissions", "writing_revisions", "reading_logs", "error_items"];
      const classOpts = `<option value="">全部</option>` + CLASSES.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>⬇ 数据导出</h1>
        <div class="card"><div class="row">
          <select id="e-table">${tables.map(t => `<option value="${t}">${t}</option>`).join("")}</select>
          <select id="e-class">${classOpts}</select>
          <input id="e-from" type="date" placeholder="开始"> <input id="e-to" type="date" placeholder="结束">
          <button class="btn-primary" id="e-go">导出 CSV</button>
        </div><p class="muted">UTF-8 带 BOM，可直接进 Excel/SPSS/R；导出会留痕。</p></div>`;
      document.getElementById("e-go").onclick = async () => {
        const t = document.getElementById("e-table").value;
        const qs = new URLSearchParams({ table: t });
        const c = document.getElementById("e-class").value; if (c) qs.set("class_id", c);
        const f = document.getElementById("e-from").value; if (f) qs.set("from_", f);
        const t2 = document.getElementById("e-to").value; if (t2) qs.set("to", t2);
        const r = await fetch("/teacher/export2?" + qs.toString(), { headers: { "X-Teacher-Token": localStorage.getItem(TOKEN_KEY) } });
        const blob = await r.blob();
        const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t + "_export.csv"; a.click();
        updateBadge();
      };
    }

    /* ================= 研究实验（L2）================= */

    /* ---------- 10 求助与交接 ---------- */
    async function viewHandoffs() {
      const el = document.getElementById("view");
      const d = await api("/teacher/handoffs?open_only=0");
      const rows = d.handoffs.map(h => `
        <tr>
          <td>${esc(h.timestamp)}</td><td>${esc(h.display_name || h.student_id)}</td><td>${esc(h.class_id || "")}</td>
          <td><span class="tag ${h.closed ? "tag-closed" : "tag-open"}">${esc(h.t_type)}</span></td>
          <td class="wrap">${esc(h.trigger || "")}</td>
          <td class="wrap">${esc(h.ai_action || "")}</td>
          <td class="wrap">${esc(h.teacher_action || "")}</td>
          <td>${h.closed ? '<span class="tag tag-closed">已闭环</span>' : `<button class="btn-primary btn-sm" data-id="${h.id}" data-act="respond">响应</button>`}</td>
        </tr>`).join("");
      el.innerHTML = `
        <h1>🔁 求助与交接 <button class="btn-primary btn-sm" id="btn-refresh" style="margin-left:8px">刷新</button></h1>
        <div class="help-box"><b>交接</b>＝学生卡住时，系统把这件事交给老师。<b>闭环</b>＝你回应并点「完成」，让这件事有结果、有记录。只记录不完成算「未闭环」。</div>
        <div class="card"><table><tr><th>时间</th><th>学生</th><th>班</th><th>类型</th><th>触发</th><th>AI 动作</th><th>教师动作</th><th>状态</th></tr>${rows || "<tr><td colspan=8>无记录</td></tr>"}</table></div>
        <div id="respond-box"></div>`;
      document.getElementById("btn-refresh").onclick = viewHandoffs;
      el.querySelectorAll("[data-act=respond]").forEach(b => {
        b.onclick = async () => {
          const hid = b.dataset.id;
          document.getElementById("respond-box").innerHTML = `
            <div class="card"><h2>回应求助 #${hid}</h2>
            <textarea id="resp-action" placeholder="你做了什么，如：课后单独讲了一遍，并给了两道练习"></textarea>
            <div class="row"><button class="btn-primary" id="btn-close">已处理，标记完成（闭环）</button>
            <button class="btn-sm" id="btn-keep">先记下，稍后处理（暂不闭环）</button></div></div>`;
          document.getElementById("btn-close").onclick = async () => {
            await api(`/teacher/handoff/${hid}/respond`, { method: "POST", body: JSON.stringify({ teacher_action: document.getElementById("resp-action").value, closed: true }) });
            viewHandoffs(); updateBadge();
          };
          document.getElementById("btn-keep").onclick = async () => {
            await api(`/teacher/handoff/${hid}/respond`, { method: "POST", body: JSON.stringify({ teacher_action: document.getElementById("resp-action").value, closed: false }) });
            viewHandoffs();
          };
        };
      });
    }

    /* ---------- 11 交接手动补录 ---------- */
    async function viewHandoffNew() {
      const el = document.getElementById("view");
      const students = (await api("/teacher/data")).students;
      const opts = students.map(s => `<option value="${s.id}">${esc(s.display_name)} (${esc(s.class_id)})</option>`).join("");
      el.innerHTML = `
        <h1>➕ 交接事件手动补录</h1>
        <p class="muted">线下发生的求助/交接，事后补记，保证研究数据完整。</p>
        <div class="card">
          <label>学生</label><select id="h-stu">${opts}</select>
          <label>T 类</label><select id="h-type">
            <option value="T1">T1 求助升级</option><option value="T2">T2 反馈授权</option>
            <option value="T3">T3 情感响应</option><option value="T4">T4 反向交接</option></select>
          <label>触发线索</label><input id="h-trigger" placeholder="如：学生第2点反馈不采纳">
          <label>AI 动作</label><input id="h-ai" placeholder="如：AI给出语法反馈">
          <label>教师动作</label><textarea id="h-teacher" placeholder="如：组织审读，学生说明理由"></textarea>
          <button class="btn-primary" id="h-submit">保存</button>
        </div>`;
      document.getElementById("h-submit").onclick = async () => {
        const student = document.getElementById("h-stu").value;
        await api("/teacher/handoff", { method: "POST", body: JSON.stringify({
          student_id: parseInt(student), t_type: document.getElementById("h-type").value,
          trigger: document.getElementById("h-trigger").value, ai_action: document.getElementById("h-ai").value,
          teacher_action: document.getElementById("h-teacher").value, source: "manual_teacher" }) });
        alert("已保存"); viewHandoffNew();
      };
    }

    /* ---------- 12 回避预警 ---------- */
    async function viewAvoidance() {
      const el = document.getElementById("view");
      const d = await api("/teacher/avoidance?resolved=0");
      const rows = d.flags.map(f => `
        <tr><td>${esc(f.triggered_at)}</td><td>${esc(f.display_name)}</td><td>${esc(f.class_id)}</td>
        <td>${esc((d.flag_labels[f.flag_type] || f.flag_type))}</td>
        <td><button class="btn-primary btn-sm" data-id="${f.id}">已接触</button></td></tr>`).join("");
      el.innerHTML = `
        <h1>⚠️ 回避预警 <button class="btn-primary btn-sm" id="btn-scan" style="margin-left:8px">立即扫描</button></h1>
        <p class="muted">研究实验功能：系统根据学习行为判断学生是否在回避学习，提醒你介入。</p>
        <div class="card"><table><tr><th>触发时间</th><th>学生</th><th>班</th><th>类型</th><th>处理</th></tr>${rows || "<tr><td colspan=5>当前无未解决预警</td></tr>"}</table></div>`;
      document.getElementById("btn-scan").onclick = async () => {
        const r = await api("/teacher/avoidance/scan", { method: "POST" });
        alert("扫描完成，新增 " + r.created.length + " 条"); viewAvoidance(); updateBadge();
      };
      el.querySelectorAll("[data-id]").forEach(b => {
        b.onclick = async () => { await api(`/teacher/avoidance/${b.dataset.id}/resolve`, { method: "POST" }); viewAvoidance(); };
      });
    }

    /* ---------- 13 T4 练习注入 ---------- */
    async function viewInject() {
      const el = document.getElementById("view");
      const d = await api("/teacher/data");
      const opts = d.classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>💉 T4 练习注入</h1>
        <p class="muted">研究实验功能：把全班的共性问题作为针对性练习注入学生端，并留下记录。</p>
        <div class="card">
          <label>目标班级</label><select id="i-class">${opts}</select>
          <label>共性形式问题 / 注入内容</label><textarea id="i-content" placeholder="如：全班 zh/ch/sh 混淆普遍，注入针对性辨音练习"></textarea>
          <button class="btn-primary" id="i-submit">注入</button>
        </div>`;
      document.getElementById("i-submit").onclick = async () => {
        await api("/teacher/inject", { method: "POST", body: JSON.stringify({
          class_id: document.getElementById("i-class").value, content: document.getElementById("i-content").value }) });
        alert("已注入并留痕"); viewInject(); updateBadge();
      };
    }

    /* ---------- 14 保真度 ---------- */
    async function viewFidelity() {
      const el = document.getElementById("view");
      const classes = (await api("/teacher/data")).classes;
      const classOpts = classes.map(c => `<option value="${esc(c.class_id)}">${esc(c.class_id)}</option>`).join("");
      el.innerHTML = `
        <h1>📋 保真度自评清单</h1>
        <p class="muted">研究实验功能：检查本轮实验的教学步骤是否按设计执行，用于研究记录。</p>
        <div class="card"><div class="row">
          <select id="f-class">${classOpts}</select>
          <select id="f-phase"><option value="P0">P0</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="T1">T1</option><option value="T2">T2</option></select>
          <input id="f-date" type="date">
          <button class="btn-primary" id="f-load">加载清单</button>
        </div><div id="f-body"></div></div>`;
      document.getElementById("f-load").onclick = async () => {
        const cls = document.getElementById("f-class").value, ph = document.getElementById("f-phase").value, dt = document.getElementById("f-date").value;
        const d = await api(`/teacher/fidelity?class_id=${cls}&phase=${ph}`);
        document.getElementById("f-body").innerHTML = `
          <p class="muted">${esc(cls)} · ${ph} · ${esc(dt || "未选日期")} · 共 ${d.items.length} 项</p>
          ${d.items.map((it, i) => `<label class="check-item"><input type="checkbox" value="${i}"> ${esc(it)}</label>`).join("")}
          <button class="btn-primary" id="f-submit">提交（提交后不可改）</button>
          ${d.submitted.length ? `<div class="card" style="margin-top:10px"><h2>已提交记录</h2>` + d.submitted.map(s => `<p>${esc(s.filled_at)} · 得分 ${s.score} · 勾选 ${s.items}</p>`).join("") + `</div>` : ""}`;
        document.getElementById("f-submit").onclick = async () => {
          const checked = [...document.querySelectorAll('#f-body input:checked')].map(i => i.value);
          try {
            const r = await api("/teacher/fidelity", { method: "POST", body: JSON.stringify({ class_id: cls, phase: ph, lesson_date: dt || "today", checked }) });
            alert("已提交，保真度得分 " + r.score + "%"); viewFidelity();
          } catch (e) { alert(e.message); }
        };
      };
    }

    /* ---------- 15 阶段管理 ---------- */
    async function viewPhases() {
      const el = document.getElementById("view");
      const d = await api("/teacher/overview");
      const phases = ["P0", "P1", "P2", "P3", "T1", "T2"];
      const rows = d.classes.map(c => `
        <tr><td><b>${esc(c.class_id)}</b></td><td><span class="tag">${esc(c.phase)}</span></td>
        <td>${c.ai_enabled ? "AI开" : "AI关"}</td><td>${c.teacher_response_allowed ? "教师响应开" : "教师响应关"}</td>
        <td><select data-class="${esc(c.class_id)}">${phases.map(p => `<option ${p === c.phase ? "selected" : ""}>${p}</option>`).join("")}</select>
        <button class="btn-primary btn-sm" data-set="${esc(c.class_id)}">切换</button></td></tr>`).join("");
      el.innerHTML = `
        <h1>🔄 阶段管理</h1>
        <p class="muted">研究实验功能：切换实验阶段，自动联动 AI 开关、练习开放和教师响应权限。切换会留痕。</p>
        <div class="card"><table><tr><th>班级</th><th>当前</th><th>AI</th><th>教师响应</th><th>切换</th></tr>${rows}</table></div>`;
      el.querySelectorAll("[data-set]").forEach(b => {
        b.onclick = async () => {
          const cls = b.dataset.set;
          const phase = el.querySelector(`select[data-class="${cls}"]`).value;
          await api("/teacher/phase", { method: "POST", body: JSON.stringify({ class_id: cls, phase }) });
          alert(`${cls} -> ${phase} 已切换`); viewPhases();
        };
      });
    }
  </script>
</body>
</html>
