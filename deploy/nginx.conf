# Thai-Chinese Tutor LIFF - Nginx 反代配置
# 放到 /etc/nginx/sites-available/liff-app，然后 ln -s 到 sites-enabled
# 把 ___DOMAIN___ 替换成你的域名（setup.sh 会自动做）

# 服务器 IP 直连 80/443（可选：让 IP 也跳 HTTPS）
server {
    listen 80;
    server_name ___DOMAIN___;
    # 80 全部跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ___DOMAIN___;

    # 证书路径（certbot -d 你的域名 自动生成后填）
    ssl_certificate     /etc/letsencrypt/live/___DOMAIN___/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/___DOMAIN___/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 主站体量小，整站反代给 uvicorn（uvicorn 已负责 /teacher、/、/assets 静态）
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 可选：让 IP 也能看（延时不阻塞证书安装，先留登出域名）
    client_max_body_size 5m;
}