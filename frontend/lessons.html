<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>课程学习 · บทเรียนของฉัน</title>
  <link rel="stylesheet" href="/assets/style.css?v=12">
  <style>
    .lessons-hero { padding: var(--s-4); display: flex; align-items: center; gap: var(--s-3); }
    .lessons-hero h1 { font-size: 1.1rem; }
    .lesson-row { display: block; padding: var(--s-5); margin: 0 var(--s-4) var(--s-3);
      background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-1);
      text-decoration: none; color: inherit; transition: all var(--t-norm);
      position: relative; overflow: hidden; }
    .lesson-row:active { transform: scale(.98); }
    .lesson-row .lr-num { font-size: .78rem; color: var(--c-muted); font-weight: 600;
      letter-spacing: .05em; }
    .lesson-row .lr-title { font-size: 1.15rem; font-weight: 700; color: var(--c-text);
      margin-top: 2px; font-family: "Noto Sans SC", sans-serif; }
    .lesson-row .lr-meta { display: flex; gap: var(--s-3); font-size: .8rem;
      color: var(--c-muted); margin-top: var(--s-2); }
    .lesson-row .lr-bar { height: 5px; background: var(--c-line); border-radius: 3px;
      margin-top: var(--s-3); overflow: hidden; }
    .lesson-row .lr-bar span { display: block; height: 100%;
      background: linear-gradient(90deg, var(--c-primary), var(--c-primary-d)); }
    .lesson-row .lr-badge { position: absolute; top: var(--s-4); right: var(--s-4);
      background: var(--c-primary); color: #fff; padding: 3px 10px;
      border-radius: 999px; font-size: .7rem; font-weight: 700; }
    .unit-row { display: block; position: relative; padding: var(--s-5); margin: 0 0 var(--s-3);
      background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-1);
      text-decoration: none; color: inherit; }
    .unit-row:active { transform: scale(.98); }
    .unit-row .ur-num { font-size: .78rem; color: var(--c-muted); font-weight: 600;
      letter-spacing: .05em; }
    .unit-row .ur-name { font-size: 1.2rem; font-weight: 700; color: var(--c-text);
      margin-top: 2px; font-family: "Noto Sans SC", sans-serif; }
    .unit-row .ur-meta { font-size: .8rem; color: var(--c-muted); margin-top: var(--s-2); }
    .unit-row .ur-arrow { position: absolute; right: var(--s-5); top: 50%;
      transform: translateY(-50%); color: var(--c-muted); font-size: 1.2rem; }
    .empty-state { text-align: center; padding: var(--s-7) var(--s-5); color: var(--c-muted); }
    .empty-state svg { width: 80px; height: 80px; margin: 0 auto var(--s-3); display: block; }
  </style>
</head>
<body>
  <div id="app" class="loading-pulse">
    <div style="display:flex;gap:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div>กำลังโหลด... 正在加载</div>
  </div>
  <script src="/assets/app.js?v=12"></script>
  <script>
    if (!App.requireLogin()) {/* redirected */} else { render(); }

    const UNIT_NAMES = {
      1: "触摸自然", 2: "革命岁月", 3: "有目的地阅读", 4: "小说",
      5: "围绕中心意思写", 6: "保护环境", 7: "艺术之美", 8: "走近鲁迅",
    };
    const CN_NUM = ["", "一", "二", "三", "四", "五", "六", "七", "八"];

    async function render() {
      const app = document.getElementById("app");
      let data = { lessons: [], ui_mode: "l2" };
      try {
        data = await App.call("/api/lessons");
      } catch (e) { /* ignore */ }
      if (data.ui_mode === "native" || data.units) return renderNative(app, data);
      const lessons = data.lessons || [];
      const cards = lessons.length
        ? lessons.map((l, i) => `
          <a class="lesson-row" href="lesson.html?lesson=${l.lesson_no}">
            ${i === 0 ? '<div class="lr-badge">▶ เริ่มเลย 开始</div>' : ''}
            <div class="lr-num">บทที่ ${l.lesson_no}</div>
            <div class="lr-title">${App.escapeHtml(l.title)}</div>
            <div class="lr-bar"><span style="width:0%"></span></div>
            <div class="lr-meta"><span>${App.escapeHtml(l.title.length)} 字</span></div>
          </a>`).join("")
        : `<div class="empty-state">
            <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
              <circle cx="40" cy="40" r="36" fill="#fff" stroke="#1f8a5f" stroke-width="3"/>
              <circle cx="20" cy="26" r="9" fill="#1f3d33"/>
              <circle cx="60" cy="26" r="9" fill="#1f3d33"/>
              <circle cx="34" cy="40" r="2.5" fill="#1f3d33"/>
              <circle cx="46" cy="40" r="2.5" fill="#1f3d33"/>
              <path d="M 34 50 Q 40 54 46 50" stroke="#1f3d33" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>
            <div>ยังไม่มีบทเรียนที่ได้รับมอบหมาย</div>
            <div style="margin-top:6px;font-size:.85rem">还没有分配给你的课程 · 请老师分配</div>
          </div>`;
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="home.html">← หน้าหลัก</a>
          <h1>📚 课程学习 · บทเรียนของฉัน</h1>
        </div>
        <div class="app-wrap fade-in">${cards}</div>`;
    }

    function renderNative(app, data) {
      const units = data.units || [];
      const draw = () => {
        const m = location.hash.match(/^#u(\d+)$/);
        if (m) renderUnitDetail(app, units, parseInt(m[1], 10));
        else renderUnitList(app, units);
        window.scrollTo({ top: 0 });
      };
      if (!window.__unitHashHooked) {
        window.addEventListener("hashchange", draw);
        window.__unitHashHooked = true;
      }
      draw();
    }

    function renderUnitList(app, units) {
      const cards = units.map(u => `
        <a class="unit-row" href="#u${u.unit}">
          <div class="ur-num">第${CN_NUM[u.unit] || u.unit}单元</div>
          <div class="ur-name">${App.escapeHtml(UNIT_NAMES[u.unit] || "")}</div>
          <div class="ur-meta">${u.lessons.length} 课${(u.writings || []).length ? " · 习作 1 篇" : ""}</div>
          <div class="ur-arrow">→</div>
        </a>`).join("");
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="home.html">← 返回</a>
          <h1>📚 六年级上册</h1>
          <div style="width:40px"></div>
        </div>
        <div class="app-wrap fade-in">
          <p class="muted" style="text-align:center;margin:var(--s-2) 0 var(--s-4)">选择单元 · เลือกหน่วย</p>
          ${cards || '<div class="card muted" style="text-align:center">还没有课程内容</div>'}
        </div>`;
    }

    function renderUnitDetail(app, units, n) {
      const u = units.find(x => x.unit === n);
      if (!u) { location.hash = ""; return; }
      const lessons = u.lessons.map(l => `
        <a class="lesson-row" href="lesson.html?lesson=${l.lesson_no}">
          <div class="lr-num">第 ${l.lesson_no} 课${l.type === "skim" ? " · 略读" : ""}</div>
          <div class="lr-title">${App.escapeHtml(l.title)}</div>
        </a>`).join("");
      const writings = (u.writings || []).length ? `
        <a class="lesson-row" href="writing.html?unit=${u.unit}" style="border-left:4px solid #c88a3e">
          <div class="lr-num">习作</div>
          <div class="lr-title">✍️ ${App.escapeHtml(u.writings[0].title || "本单元习作")}</div>
        </a>` : "";
      const first = (u.lessons[0] || {}).lesson_no || 1;
      const quiz = `
        <a class="lesson-row" href="lesson.html?lesson=${first}&module=unit_quiz" style="border-left:4px solid #8a6fd1">
          <div class="lr-num">第${CN_NUM[n] || n}单元</div>
          <div class="lr-title">🧪 单元测验</div>
          <div class="lr-meta"><span id="uq-cnt">全单元综合题</span></div>
        </a>`;
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="lessons.html">← 单元</a>
          <h1 class="t-cn">第${CN_NUM[n] || n}单元</h1>
          <div style="width:40px"></div>
        </div>
        <div class="app-wrap fade-in">
          <p class="muted" style="text-align:center;margin:var(--s-2) 0 var(--s-4)">
            ${App.escapeHtml(UNIT_NAMES[n] || "")}
          </p>
          ${lessons}${writings}${quiz}
        </div>`;
      App.call("/api/unit_quiz?lesson=" + first).then(d => {
        const el = document.getElementById("uq-cnt");
        if (el && d && d.count) el.textContent = `${d.count} 题 · 全单元综合`;
      }).catch(() => {});
    }
  </script>
</body>
</html>
