<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>课程学习 · บทเรียนของฉัน</title>
  <link rel="stylesheet" href="/assets/style.css?v=15">
</head>
<body>
  <div id="app" class="loading-pulse">
    <div style="display:flex;gap:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div>กำลังโหลด... 正在加载</div>
  </div>
  <script src="/assets/app.js?v=12"></script>
  <script>
    if (!App.requireLogin()) {/* redirected */} else { render(); }

    const UNIT_NAMES = {
      1: "触摸自然", 2: "革命岁月", 3: "有目的地阅读", 4: "小说",
      5: "围绕中心意思写", 6: "保护环境", 7: "艺术之美", 8: "走近鲁迅",
    };
    const CN_NUM = ["", "一", "二", "三", "四", "五", "六", "七", "八"];

    async function render() {
      const app = document.getElementById("app");
      let data = { lessons: [], ui_mode: "l2" };
      try {
        data = await App.call("/api/lessons");
      } catch (e) { /* ignore */ }
      if (data.ui_mode === "native" || data.units) return renderNative(app, data);
      const lessons = data.lessons || [];
      app.className = "fit-screen";
      const cards = lessons.length
        ? `<div class="fit-grid">${lessons.map(l => `
          <a class="fit-card" href="lesson.html?lesson=${l.lesson_no}">
            <div class="fc-top">บทที่ ${l.lesson_no}</div>
            <div class="fc-title">${App.escapeHtml(l.title)}</div>
          </a>`).join("")}</div>`
        : `<p class="muted" style="text-align:center">ยังไม่มีบทเรียนที่ได้รับมอบหมาย<br>还没有分配给你的课程</p>`;
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="home.html">← หน้าหลัก</a>
          <h1>📚 บทเรียนของฉัน</h1>
        </div>
        <div class="fit-body">${cards}</div>`;
    }

    function renderNative(app, data) {
      const units = data.units || [];
      app.className = "fit-screen";
      const draw = () => {
        const m = location.hash.match(/^#u(\d+)$/);
        if (m) renderUnitDetail(app, units, parseInt(m[1], 10));
        else renderUnitList(app, units);
        window.scrollTo({ top: 0 });
      };
      if (!window.__unitHashHooked) {
        window.addEventListener("hashchange", draw);
        window.__unitHashHooked = true;
      }
      draw();
    }

    function renderUnitList(app, units) {
      const cards = units.map(u => `
        <a class="fit-card" href="#u${u.unit}">
          <div class="fc-top">第${CN_NUM[u.unit] || u.unit}单元</div>
          <div class="fc-title">${App.escapeHtml(UNIT_NAMES[u.unit] || "")}</div>
          <div class="fc-sub">${u.lessons.length} 课${(u.writings || []).length ? " · 习作" : ""}</div>
        </a>`).join("");
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="home.html">← 返回</a>
          <h1>📚 六年级上册</h1>
          <div style="width:40px"></div>
        </div>
        <div class="fit-body">
          ${cards ? `<div class="fit-grid">${cards}</div>` : '<p class="muted" style="text-align:center">还没有课程内容</p>'}
        </div>`;
    }

    function renderUnitDetail(app, units, n) {
      const u = units.find(x => x.unit === n);
      if (!u) { location.hash = ""; return; }
      const cards = u.lessons.map(l => `
        <a class="fit-card" href="lesson.html?lesson=${l.lesson_no}">
          <div class="fc-top">第 ${l.lesson_no} 课${l.type === "skim" ? " · 略读" : ""}</div>
          <div class="fc-title">${App.escapeHtml(l.title)}</div>
        </a>`);
      if ((u.writings || []).length) cards.push(`
        <a class="fit-card" href="writing.html?unit=${u.unit}">
          <div class="fc-top">习作</div>
          <div class="fc-title">✍️ ${App.escapeHtml(u.writings[0].title || "本单元习作")}</div>
        </a>`);
      const first = (u.lessons[0] || {}).lesson_no || 1;
      cards.push(`
        <a class="fit-card" href="lesson.html?lesson=${first}&module=unit_quiz">
          <div class="fc-top">第${CN_NUM[n] || n}单元</div>
          <div class="fc-title">🧪 单元测验</div>
          <div class="fc-sub" id="uq-cnt">全单元综合</div>
        </a>`);
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="lessons.html">← 单元</a>
          <h1 class="t-cn">第${CN_NUM[n] || n}单元</h1>
          <div style="width:40px"></div>
        </div>
        <div class="fit-body">
          <div class="fit-grid">${cards.join("")}</div>
        </div>`;
      App.call("/api/unit_quiz?lesson=" + first).then(d => {
        const el = document.getElementById("uq-cnt");
        if (el && d && d.count) el.textContent = `${d.count} 题`;
      }).catch(() => {});
    }
  </script>
</body>
</html>
