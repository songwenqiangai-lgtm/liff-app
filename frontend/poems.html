<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>每日积累 · 古诗文</title>
  <link rel="stylesheet" href="/assets/style.css?v=15">
  <style>
    .poem-body { font-size:1.1rem; line-height:2.1; text-align:center; white-space:pre-wrap;
      font-family:"Noto Sans SC",sans-serif; margin:14px 0; }
    details summary { cursor:pointer; font-weight:600; color:var(--c-text-2); }
    .poem-card { margin-bottom:14px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back" href="home.html">← 返回</a>
    <h1>🏮 古诗文积累</h1>
    <div style="width:40px"></div>
  </div>
  <div id="app" class="app-wrap fade-in loading-pulse" style="text-align:center;padding-top:40px">正在加载...</div>
  <script src="/assets/app.js?v=12"></script>
  <script>
    if (!App.requireLogin()) { /* redirect */ } else { load(); }

    const CN = ["", "一", "二", "三", "四", "五", "六", "七", "八"];

    async function load() {
      const app = document.getElementById("app");
      let poems = [];
      try { poems = (await App.call("/api/poems")).poems || []; }
      catch (e) { app.innerHTML = '<div class="card">加载失败，请稍后重试</div>'; return; }
      if (!poems.length) { app.innerHTML = '<div class="card" style="text-align:center">还没有古诗文内容</div>'; return; }
      const groups = {};
      poems.forEach(p => (groups[p.unit || 0] = groups[p.unit || 0] || []).push(p));
      app.innerHTML = Object.keys(groups).sort((a, b) => a - b).map(u => `
        <h2 style="margin:16px var(--s-4) 8px;font-size:1rem;color:var(--c-muted)">第${CN[u] || u}单元</h2>
        ${groups[u].map((p, ji) => {
          const idx = poems.indexOf(p);
          return `<div class="card poem-card fade-in" data-i="${idx}">
            <div>
              <div style="font-weight:700;font-size:1.08rem" class="t-cn">${App.escapeHtml(p.title)}</div>
              <div class="muted" style="font-size:.8rem">${App.escapeHtml([p.dynasty, p.author].filter(Boolean).join(" · "))}</div>
            </div>
            <div class="poem-body t-cn">${App.escapeHtml(p.body)}</div>
            <button class="btn btn-secondary btn-block" data-say="${idx}">🔊 朗读</button>
            ${(p.notes || []).length ? `<details style="margin-top:12px"><summary>注释</summary>
              <div style="margin-top:8px;font-size:.88rem;line-height:1.8">${p.notes.map(n =>
                `<div><b>${App.escapeHtml(n.word || "")}</b>：${App.escapeHtml(n.note || "")}</div>`).join("")}</div></details>` : ""}
            ${p.translation ? `<details style="margin-top:8px"><summary>译文</summary>
              <div style="margin-top:8px;font-size:.9rem;line-height:1.9">${App.escapeHtml(p.translation)}</div></details>` : ""}
          </div>`;
        }).join("")}`).join("");

      app.querySelectorAll("[data-say]").forEach(b => b.onclick = () => {
        App.speak(poems[parseInt(b.dataset.say)].body);
      });
    }
  </script>
</body>
</html>
