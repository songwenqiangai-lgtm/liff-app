<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>เข้าสู่ระบบ · 中文小老师</title>
  <link rel="stylesheet" href="/assets/style.css?v=15">
  <style>
    .login-shell { min-height: 100vh; display: flex; flex-direction: column;
      padding: var(--s-3) var(--s-4) calc(var(--s-4) + env(safe-area-inset-bottom)); }
    .login-topbar { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) 0 var(--s-2); }
    .login-topbar img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; box-shadow: var(--sh-1); }
    .login-topbar .app-name { font-weight: 800; font-size: 1rem; color: var(--c-text); line-height: 1.3; }
    .login-topbar .app-sub { font-size: .72rem; color: var(--c-muted); line-height: 1.3; }
    .login-card { background: #fff; border-radius: var(--r-lg); padding: var(--s-4) var(--s-4);
      box-shadow: var(--sh-2); margin-top: var(--s-2); }
    .login-card label { font-size: .78rem !important; margin-top: var(--s-2) !important;
      margin-bottom: 4px !important; }
    .login-card .card { margin-bottom: 0; }
    .err-banner { background: #fdeae5; color: #c0392b; padding: var(--s-3) var(--s-4);
      border-radius: var(--r-sm); font-size: .9rem; margin-bottom: var(--s-3); display: none; }
    .err-banner.show { display: block; }
    select, input[type=text], input[type=password] { padding: 11px 14px;
      border: 2px solid var(--c-line-2); border-radius: 12px; font-size: 1rem;
      font-family: inherit; width: 100%; background: #fff; color: var(--c-text);
      transition: border-color var(--t-fast), box-shadow var(--t-fast); }
    select:focus, input:focus { outline: none; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px rgba(31,138,95,.12); }
    .class-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      margin-bottom: var(--s-3); }
    .cls-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 0;
      padding: 7px 10px; border: 2px solid var(--c-line-2); border-radius: 11px;
      background: #fff; color: var(--c-text); font-family: inherit; font-size: .86rem;
      font-weight: 700; text-align: left; cursor: pointer;
      transition: all var(--t-fast); -webkit-tap-highlight-color: transparent; }
    .cls-btn span { font-size: .62rem; font-weight: 500; color: var(--c-muted); line-height: 1.25; }
    .cls-btn.sel { border-color: var(--c-primary); background: var(--c-primary-l);
      box-shadow: 0 0 0 3px rgba(31,138,95,.12); }
    .cls-btn.sel span { color: var(--c-primary-d); }
    /* 矮屏（如 360×640）进一步压缩，保证一屏放下 */
    @media (max-height: 700px) {
      .login-topbar { padding: 0 0 var(--s-1); }
      .login-topbar img { width: 30px; height: 30px; }
      .login-topbar .app-name { font-size: .94rem; }
      .login-card { padding: var(--s-3); }
      .cls-btn { padding: 5px 9px; font-size: .82rem; }
      .cls-btn span { font-size: .58rem; }
      .login-foot { display: none; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <div class="login-topbar">
      <img src="/assets/logo.jpg" alt="logo">
      <div>
        <div class="app-name">中文小老师</div>
        <div class="app-sub">ครูจีน AI · 学生登录</div>
      </div>
    </div>

    <div class="card login-card fade-in">
      <div id="err" class="err-banner"></div>

      <label>บทเรียน · 班级 / ห้องเรียน</label>
      <input type="hidden" id="class" value="">
      <div class="class-grid" id="class-grid">
        <button type="button" class="cls-btn" data-v="M4/1">M4/1<span>初一理科</span></button>
        <button type="button" class="cls-btn" data-v="M4/2">M4/2<span>初一文科</span></button>
        <button type="button" class="cls-btn" data-v="M5/1">M5/1<span>初二理科</span></button>
        <button type="button" class="cls-btn" data-v="M5/2">M5/2<span>初二文科</span></button>
        <button type="button" class="cls-btn" data-v="M6/1">M6/1<span>初三理科</span></button>
        <button type="button" class="cls-btn" data-v="M6/2">M6/2<span>初三文科</span></button>
        <button type="button" class="cls-btn" data-v="C6/1" style="grid-column: span 3">C6/1<span>中文六年级（国内课程）</span></button>
      </div>

      <label>รหัสนักเรียน · 学号</label>
      <input id="sno" type="text" placeholder="กรอกรหัสนักเรียน 输入学号" autocomplete="username">

      <label>รหัสผ่าน · 密码</label>
      <input id="pwd" type="password" placeholder="รหัสผ่าน 输入密码" autocomplete="current-password">

      <button class="btn btn-primary btn-block btn-xl" id="btn-login" style="margin-top: var(--s-4)">เข้าสู่ระบบ 登录</button>
      <button class="btn btn-ghost btn-block" id="btn-dev" style="margin-top: var(--s-1); font-size: .78rem; color: var(--c-muted)">调试入口（/dev/）</button>
    </div>

    <p class="muted login-foot" style="text-align:center; margin-top: var(--s-2); font-size: .74rem">
      💡 首次登录：密码和学号相同 · เข้าครั้งแรก: รหัสผ่านเหมือนรหัสนักเรียน
    </p>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    function showErr(msg) {
      const e = $("err");
      e.textContent = msg; e.classList.add("show");
    }
    function clearErr() { $("err").classList.remove("show"); }

    const grid = $("class-grid");
    grid.querySelectorAll(".cls-btn").forEach(b => {
      b.onclick = () => {
        grid.querySelectorAll(".cls-btn").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        $("class").value = b.dataset.v;
        clearErr();
      };
    });
    const lastClass = localStorage.getItem("last_class");
    if (lastClass) {
      const b = grid.querySelector(`.cls-btn[data-v="${lastClass}"]`);
      if (b) b.click();
    }

    $("btn-login").onclick = async () => {
      clearErr();
      const class_id = $("class").value;
      const student_no = $("sno").value.trim();
      const password = $("pwd").value.trim();
      if (!class_id) return showErr("请选择班级 / กรุณาเลือกบทเรียน");
      if (!student_no) return showErr("请填写学号 / กรุณากรอกรหัสนักเรียน");
      if (!password) return showErr("请填写密码 / กรุณากรอกรหัสผ่าน");
      $("btn-login").disabled = true; $("btn-login").textContent = "登录中...";
      try {
        const r = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ class_id, student_no, password })
        });
        if (!r.ok) {
          let msg = "登录失败，请重试";
          try { msg = (await r.json()).detail || msg; } catch (e) {}
          throw new Error(msg);
        }
        const data = await r.json();
        localStorage.setItem("session_token", data.token);
        localStorage.setItem("class_id", data.student.class_id);
        localStorage.setItem("last_class", data.student.class_id);
        localStorage.setItem("track", data.student.track);
        localStorage.setItem("display_name", data.student.display_name || "");
        localStorage.setItem("ui_mode", data.ui_mode || "l2");
        localStorage.setItem("class_name", data.class_name || data.student.class_id);
        location.href = "home.html";
      } catch (e) {
        showErr(typeof e.message === "string" ? e.message : "登录失败");
        $("btn-login").disabled = false; $("btn-login").textContent = "เข้าสู่ระบบ 登录";
      }
    };
    $("btn-dev").onclick = () => location.href = "/dev/";
  </script>
</body>
</html>
