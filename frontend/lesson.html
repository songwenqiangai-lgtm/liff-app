<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>บทเรียน · 课程</title>
  <link rel="stylesheet" href="/assets/style.css?v=12">
  <style>
    /* 课文每句布局 */
    .sent-line { display: flex; align-items: flex-start; gap: 6px; padding: 6px 0;
      border-bottom: 1px dashed transparent; }
    .sent-line:hover { background: rgba(31,138,95,.04); border-radius: 6px; }
    .sent-zh { flex: 1; font-family: "Noto Sans SC", sans-serif; }
    .sent-mini-play { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 50%;
      background: var(--c-primary-l); color: var(--c-primary-d); display: inline-flex;
      align-items: center; justify-content: center; border: none; cursor: pointer; font-size: .9rem; }
    /* 音节色块 */
    .syll { display: inline-block; padding: 2px 6px; margin: 0 2px; border-radius: 6px;
      font-weight: 600; }
    .syll.tone-1 { background: rgba(220,80,80,.15); color: #c0392b; }
    .syll.tone-2 { background: rgba(240,180,40,.18); color: #b8860b; }
    .syll.tone-3 { background: rgba(80,170,120,.15); color: #1f8a5f; }
    .syll.tone-4 { background: rgba(90,140,200,.15); color: #2e6cb0; }
    /* 单词大字带拼音 */
    .word-zh { font-family: "Noto Sans SC", sans-serif; font-size: 1.15rem; font-weight: 700;
      margin-right: 8px; }
    .word-py { font-family: "Noto Sans SC", sans-serif; font-size: .8rem; color: var(--c-muted); }
    /* 闪卡大字呼吸 */
    .flash-word-mark { position: relative; }
  </style>
</head>
<body>
  <div id="app" class="loading-pulse">
    <div style="display:flex;gap:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <div>กำลังโหลด... 正在加载</div>
  </div>
  <script src="/assets/app.js?v=12"></script>
  <script>
    const LESSON = new URLSearchParams(location.search).get("lesson") || "1";
    const MODULE = new URLSearchParams(location.search).get("module") || "";
    const MODULE_LABELS = { pattern: "句型操练", vocab: "词汇", chat: "会话", writing: "写作" };
    let DATA = null, exIdx = 0, exBusy = false, vocabIdx = 0;

    (async () => {
      if (!App.requireLogin()) return;
      const app = document.getElementById("app");
      try {
        DATA = await App.call("/api/lesson?lesson=" + LESSON);
      } catch (e) {
        app.innerHTML = '<div class="app-wrap"><div class="card"><p class="muted">โหลดข้อมูลไม่สำเร็จ</p></div></div>';
        return;
      }
      if (DATA.ui_mode === "native") {
        if (MODULE) renderNativeModule(MODULE);
        else renderNativeGrid();
      } else if (MODULE) renderModule(MODULE);
      else renderGrid();
    })();

    /* ===== 课程主页：2×3 模块网格 ===== */
    function renderGrid() {
      const app = document.getElementById("app");
      const title = DATA.text ? DATA.text.title : ("บทที่ " + LESSON);
      const modules = [
        { key: "vocab", icon: "📖", zh: "单词", th: "คำศัพท์", on: true },
        { key: "text", icon: "📄", zh: "课文", th: "บทอ่าน", on: true },
        { key: "grammar", icon: "✏️", zh: "语法", th: "ไวยากรณ์", on: true },
        { key: "exercise", icon: "🏋️", zh: "练习", th: "แบบฝึกหัด", on: DATA.sections.exercise },
        { key: "pronounce", icon: "🗣️", zh: "发音", th: "ออกเสียง", on: DATA.sections.exercise },
        { key: "exam", icon: "📝", zh: "考试", th: "ข้อสอบ", on: DATA.sections.exam },
      ];
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="/">← กลับ 返回</a>
          <h1 class="t-cn">${App.escapeHtml(title)}</h1>
          <a class="btn btn-ghost btn-icon" href="lesson.html?lesson=${Math.min(parseInt(LESSON) + 1, 99)}" title="下一课">→</a>
        </div>
        <div class="app-wrap fade-in">
          <p class="muted" style="text-align:center;margin-top: var(--s-2)">เลือกหัวข้อเพื่อเริ่มเรียน · 选择模块开始学习</p>
          <div class="module-grid-2">
            ${modules.map(m => `
              <a class="module-card ${m.on ? "" : "locked"}" ${m.on ? `href="lesson.html?lesson=${LESSON}&module=${m.key}"` : ""}>
                <div class="mc-icon">${m.icon}</div>
                <div class="mc-zh">${m.zh}</div>
                <div class="mc-th">${m.th}</div>
                ${m.on ? '<div class="mc-arrow">→</div>' : ""}
              </a>`).join("")}
          </div>
        </div>`;
    }

    /* ===== 模块内容页（点击卡片进入） ===== */
    function renderModule(key) {
      const app = document.getElementById("app");
      const title = DATA.text ? DATA.text.title : ("บทที่ " + LESSON);
      const labels = { vocab: ["📖", "单词"], text: ["📄", "课文"], grammar: ["✏️", "语法"],
        exercise: ["🏋️", "练习"], pronounce: ["🗣️", "发音"], exam: ["📝", "考试"] };
      const [icon, zh] = labels[key] || ["", ""];
      app.innerHTML = `
        <div class="top-bar">
          <a class="back" href="lesson.html?lesson=${LESSON}">← บทเรียน</a>
          <h1 class="t-cn">${icon} ${App.escapeHtml(zh)} · ${App.escapeHtml(title)}</h1>
          <div style="width:40px"></div>
        </div>
        <div class="app-wrap fade-in">
          <div id="tab-content"></div>
        </div>`;
      const el = document.getElementById("tab-content");
      if (key === "vocab") renderVocab(el);
      else if (key === "text") renderText(el);
      else if (key === "grammar") renderGrammar(el);
      else if (key === "exercise") renderExercise(el);
      else if (key === "pronounce") renderPronounce(el);
      else if (key === "exam") renderExam(el);
      window.scrollTo({ top: 0 });
    }

    /* ===== 单词闪卡 ===== */
    function renderVocab(el) {
      const words = DATA.vocab || [];
      if (!words.length) { el.innerHTML = '<div class="card muted" style="text-align:center">ยังไม่มีคำศัพท์</div>'; return; }
      if (vocabIdx >= words.length) vocabIdx = 0;
      const w = words[vocabIdx];
      el.innerHTML = `
        <div class="card flashcard fade-in" id="flashcard">
          <div class="flash-card-toolbar">
              <button class="btn btn-secondary btn-sm" id="vocab-list-btn">📋 词表 (${words.length})</button>
              <span class="muted t-mono">${vocabIdx + 1} / ${words.length}</span>
            </div>
            <button class="btn btn-primary btn-block btn-lg" id="vocab-say" style="margin: var(--s-4) 0">🔊 ฟังเสียง · 听发音</button>
            <div class="flash-word flash-word-mark">${App.escapeHtml(w.word)}</div>
            <div class="flash-pinyin">${App.escapeHtml(w.pinyin || "")}</div>
            <div class="flash-meaning">${App.escapeHtml(w.meaning_th || "")}</div>
            ${w.example_zh ? `<div class="flash-example">📝 ${App.escapeHtml(w.example_zh)}</div>` : ""}
            <div class="flash-card-actions">
              <button class="btn btn-secondary btn-lg" id="vocab-prev" ${vocabIdx === 0 ? "disabled" : ""}>‹ ก่อนหน้า</button>
              <button class="btn btn-primary btn-lg" id="vocab-next" ${vocabIdx === words.length - 1 ? "disabled" : ""}>ถัดไป ›</button>
            </div>
            <div class="flash-progress" style="margin-top: var(--s-4)">
              <div class="bar"><span style="width:${((vocabIdx + 1) / words.length) * 100}%"></span></div>
            </div>
          </div>
          <div id="vocab-list" style="display:none"></div>`;
      document.getElementById("vocab-say").onclick = () => App.speak(w.word, w.audio_url);
      document.getElementById("vocab-prev").onclick = () => { vocabIdx--; renderVocab(el); };
      document.getElementById("vocab-next").onclick = () => { vocabIdx++; renderVocab(el); };
      document.getElementById("vocab-list-btn").onclick = () => {
        const box = document.getElementById("vocab-list");
        if (box.style.display === "none") {
          box.style.display = "block";
          box.innerHTML = `<div class="card">${words.map((v, i) =>
            `<div class="vocab-list-item ${i === vocabIdx ? 'active' : ''}" data-i="${i}">
              <span class="word-zh">${App.escapeHtml(v.word)}</span><span class="word-py">${App.escapeHtml(v.pinyin || "")}</span>
              <span style="flex:1"></span><span style="font-size:.85rem;color:var(--c-muted)">${App.escapeHtml(v.meaning_th || "")}</span>
            </div>`).join("")}</div>`;
          box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { vocabIdx = parseInt(b.dataset.i); renderVocab(el); window.scrollTo({top:0,behavior:'smooth'}); });
        } else box.style.display = "none";
      };
    }

    /* ===== 课文 ===== */
    function renderText(el) {
      const t = DATA.text;
      if (!t) { el.innerHTML = '<div class="card muted" style="text-align:center">ยังไม่มีบทอ่าน</div>'; return; }
      const zh = t.body_zh || "";
      const th = t.body_th || "";
      const sents = zh.match(/[^。！？\n]+[。！？]?/g) || [zh];
      const thSents = th.match(/[^。！？\n]+[。！？]?/g) || [];
      const sentRows = sents.map((s, i) => `
        <div class="sent-line">
          <span class="sent-zh t-cn">${App.escapeHtml(s.trim())}</span>
          <button class="sent-mini-play" data-zi="${i}" title="朗读">🔊</button>
        </div>`).join("");
      const thRows = thSents.map(s => `<p style="margin-top: var(--s-2)">${App.escapeHtml(s.trim())}</p>`).join("");
      el.innerHTML = `
        <div class="card text-card fade-in">
          <h2 style="margin-bottom: var(--s-2)">📄 บทอ่าน · 课文</h2>
          ${t.audio_url ? `<button class="btn btn-primary btn-block btn-lg" id="text-say" style="margin-bottom: var(--s-4)">🔊 ฟังบทอ่าน · 播放全文</button>` : ""}
          <div class="zh">${sentRows}</div>
          ${th ? `<div class="th">${thRows}</div>` : ""}
        </div>
        <p class="muted" style="text-align:center;margin-top: var(--s-4)">🔊 = 单句朗读 · 点击右侧</p>`;
      const btnSay = document.getElementById("text-say");
      if (btnSay) btnSay.onclick = () => App.speak(t.body_zh, t.audio_url);
      el.querySelectorAll("[data-zi]").forEach(b => {
        b.onclick = () => {
          const text = sents[parseInt(b.dataset.zi)] || "";
          if (text) App.speak(text.trim());
        };
      });
    }

    /* ===== 语法 ===== */
    function renderGrammar(el) {
      const g = DATA.grammar || [];
      if (!g.length) { el.innerHTML = '<div class="card muted" style="text-align:center">ยังไม่มีไวยากรณ์</div>'; return; }
      el.innerHTML = `<h2 style="margin-top: var(--s-3)">✏️ ไวยากรณ์ · 语法</h2>` + g.map(p => `
        <div class="card grammar-card fade-in">
          <div class="grammar-point t-cn">${App.escapeHtml(p.point)}</div>
          <div class="grammar-explain">${App.escapeHtml(p.explanation_th || "")}</div>
          ${(p.example_zh || p.example_th) ? `<div class="grammar-example">
            <div class="ex-zh">${App.escapeHtml(p.example_zh || "")}</div>
            <div class="ex-th">${App.escapeHtml(p.example_th || "")}</div>
          </div>` : ""}
        </div>`).join("");
    }

    /* ===== 练习 ===== */
    function renderExercise(el) {
      const items = DATA.exercises;
      if (!items.length) { el.innerHTML = '<div class="card muted" style="text-align:center">ยังไม่มีแบบฝึกหัด</div>'; return; }
      const it = items[exIdx];
      el.innerHTML = `
        <div class="card fade-in">
          <div class="exercise-header">
            <span class="muted t-mono">${exIdx + 1} / ${items.length}</span>
            <div class="progress"><div class="bar"><span style="width:${((exIdx + 1) / items.length) * 100}%"></span></div></div>
            <span class="badge" style="background:var(--c-primary-l);color:var(--c-primary-d);padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600">${MODULE_LABELS[it.module] || it.module}</span>
          </div>
          <div class="exercise-q t-cn">${App.escapeHtml(it.prompt_zh)}</div>
          <div class="exercise-q-th">${App.escapeHtml(it.prompt_th || "")}</div>
          <div class="exercise-input">
            <textarea id="input" placeholder="พิมพ์คำตอบภาษาจีนที่นี่... 在这里输入你的答案" rows="3"></textarea>
            <div class="exercise-input-row">
              <button class="btn btn-secondary" id="btn-exmic">🎤 พูด 语音</button>
              <button class="btn btn-primary" id="btn-submit">ส่ง 提交</button>
            </div>
          </div>
          <div id="feedback"></div>
        </div>`;
      document.getElementById("btn-exmic").onclick = () => exMic(el);
      document.getElementById("btn-submit").onclick = () => submitExercise(it, el);
    }

    function exMic(el) {
      if (!App.speechSupported()) { alert("อุปกรณ์นี้ไม่รองรับการพูด (此设备不支持语音识别)"); return; }
      const btn = document.getElementById("btn-exmic");
      btn.textContent = "⏺ กำลังฟัง... (正在听...)";
      App.speech("zh-CN",
        (final) => { const ta = document.getElementById("input"); ta.value += (ta.value ? "" : "") + final; btn.textContent = "🎤 พูด 语音"; },
        (interim) => { document.getElementById("input").placeholder = interim || "พิมพ์คำตอบภาษาจีนที่นี่..."; },
        () => { btn.textContent = "🎤 พูด 语音"; });
    }

    async function submitExercise(it, el) {
      if (exBusy) return;
      const input = document.getElementById("input").value.trim();
      if (!input) { alert("กรุณาพิมพ์คำตอบ (请输入答案)"); return; }
      exBusy = true;
      const btn = document.getElementById("btn-submit");
      btn.disabled = true; btn.textContent = "🤔 ครู AI กำลังดู...";
      const fb = document.getElementById("feedback");
      fb.innerHTML = '<div class="loading-pulse"><div style="display:flex;gap:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><span>AI 思考中...</span></div>';
      try {
        const r = await App.call("/api/feedback", { method: "POST", body: JSON.stringify({ module: it.module, item_id: it.id, input_text: input }) });
        const verdictMap = { correct: ["✅ เยี่ยมมาก!", "correct"], partial: ["💡 เกือบถูกแล้ว!", "partial"], incorrect: ["💡 ลองใหม่อีกครั้ง", "incorrect"] };
        const [badgeText, cls] = verdictMap[r.verdict] || ["", ""];
        fb.innerHTML = `
          <div class="feedback-box ${cls} fade-in">
            <div class="verdict-badge ${cls}">${badgeText}</div>
            <div>${App.escapeHtml(r.feedback_th || "")}</div>
            ${r.example_zh ? `<span class="zh">📄 ${App.escapeHtml(r.example_zh)}</span>` : ""}
          </div>
          <div class="hint-row">
            ${r.hint1_th ? '<button class="hint-pill" data-h="1">💡 คำใบ้ที่ 1</button>' : ""}
            ${r.hint2_th ? '<button class="hint-pill" data-h="2">💡💡 คำใบ้ที่ 2</button>' : ""}
            ${r.example_zh ? '<button class="hint-pill" data-h="3">📖 ตัวอย่าง</button>' : ""}
            ${r.answer_zh ? '<button class="hint-pill" data-h="4">✅ เฉลย</button>' : ""}
          </div>
          <div id="reveals"></div>
          ${it.explanation_th ? `<div class="explain-box"><b>ทำไมถึงเป็นแบบนี้ · 为什么这么答</b><br>${App.escapeHtml(it.explanation_th)}</div>` : ""}
          <div class="decision-row" id="decision-box">
            <div class="d-q">ครู AI พูดถูกไหม · AI 说得对吗？</div>
            <div class="decision-opts">
              <button data-r="agree">👍 เห็นด้วย 同意</button>
              <button data-r="disagree">👎 ไม่เห็นด้วย 不同意</button>
              <button data-r="not_sure">🤔 ไม่แน่ใจ 不确定</button>
            </div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="btn-next" style="margin-top: var(--s-5)">${exIdx === DATA.exercises.length - 1 ? "🎉 จบแล้ว 完成！" : "ข้อถัดไป 下一题 →"}</button>`;
        document.getElementById("btn-next").onclick = () => {
          exIdx = exIdx === DATA.exercises.length - 1 ? 0 : exIdx + 1;
          renderModule("exercise"); window.scrollTo({top:0,behavior:'smooth'});
        };
        const HINTS = { 1: r.hint1_th, 2: r.hint2_th, 3: "📖 " + (r.example_zh || ""), 4: "✅ " + (r.answer_zh || "") };
        fb.querySelectorAll("[data-h]").forEach(b => {
          b.onclick = async () => {
            const lv = parseInt(b.dataset.h);
            b.disabled = true;
            const div = document.createElement("div");
            div.className = "revealed-hint";
            div.innerHTML = "<b>提示</b> " + App.escapeHtml(HINTS[lv] || "");
            document.getElementById("reveals").appendChild(div);
            App.call("/api/hint", { method: "POST", body: JSON.stringify({ module: it.module, item_id: it.id, hint_level: lv }) }).catch(() => {});
          };
        });
        // F4：反馈采纳理由（H3 能动性中介的行为证据）
        fb.querySelectorAll("#decision-box [data-r]").forEach(b => {
          b.onclick = async () => {
            const box = document.getElementById("decision-box");
            const kind = b.dataset.r;
            let text = "";
            if (kind === "disagree") {
              text = (prompt("可以说说你为什么不同意吗？（可留空）\nบอกเหตุผลที่เห็นต่างได้ไหม") || "").trim();
            }
            box.querySelectorAll("[data-r]").forEach(x => { x.disabled = true; });
            b.classList.add("chosen");
            const note = { agree: "你同意 AI 的反馈", disagree: "你不同意 AI 的反馈", not_sure: "你还不确定" }[kind] || "";
            try {
              await App.call("/api/feedback/reason", {
                method: "POST",
                body: JSON.stringify({ reason_type: kind, reason_text: text, item_id: it.id }),
              });
            } catch (e) { /* 记录失败不影响继续做题 */ }
            box.insertAdjacentHTML("beforeend",
              `<div class="decision-done" style="margin-top:8px">✅ 已记录：${App.escapeHtml(note)}</div>`);
          };
        });
      } catch (e) {
        const msg = String((e && e.message) || e).slice(0, 140);
        fb.innerHTML = `<div class="feedback-box error-text">提交失败：${App.escapeHtml(msg)}<br>`
          + '<span style="font-size:.85rem">如果提示 504 或超时，是 AI 响应较慢，稍等片刻重试即可。</span></div>'
          + '<button class="btn btn-primary btn-block" id="btn-retry" style="margin-top:var(--s-3)">重新提交</button>';
        const rb = document.getElementById("btn-retry");
        if (rb) rb.onclick = () => submitExercise(it, el);
      } finally {
        exBusy = false;
        btn.disabled = false; btn.textContent = "ส่ง 提交";
      }
    }

    /* ===== 发音 ===== */
    function renderPronounce(el) {
      let targets = [];
      if (DATA.text && DATA.text.body_zh) {
        targets = DATA.text.body_zh.match(/[^。！？\n]+[。！？]?/g) || [];
      }
      if (!targets.length) targets = (DATA.vocab || []).map(v => v.word);
      if (!targets.length) { el.innerHTML = '<div class="card muted" style="text-align:center">ยังไม่มีประโยคให้ฝึก</div>'; return; }
      el.innerHTML = `
        <div class="card fade-in" style="margin-bottom: var(--s-4)">
          <h2 style="margin-bottom: var(--s-2)">🗣️ ฝึกออกเสียง · 发音</h2>
          <p class="muted">先点「🔊 先听一遍」听发音，再点「🎤 跟读」让 AI 评价</p>
        </div>` + targets.map((s, i) => `
          <div class="card fade-in" style="padding: var(--s-4)">
            <div style="display:flex;align-items:center;gap: var(--s-3);margin-bottom: var(--s-3)">
              <span class="muted t-mono">${i + 1}</span>
              <div style="flex:1" class="t-cn">${App.escapeHtml(s.trim())}</div>
            </div>
            <button class="btn btn-secondary btn-block btn-lg" data-listen="${i}" style="margin-bottom:var(--s-2)">🔊 ฟังก่อน · 先听一遍</button>
            <button class="btn btn-primary btn-block btn-lg" data-p="${i}">🎤 跟读</button>
            <div id="pr-${i}"></div>
          </div>`).join("");
      el.querySelectorAll("[data-listen]").forEach(b => b.onclick = () => {
        App.speak(targets[parseInt(b.dataset.listen)].trim());
      });
      el.querySelectorAll("[data-p]").forEach(b => b.onclick = () => pronounceOne(el, targets, parseInt(b.dataset.p), b));
    }

    async function pronounceOne(el, targets, i, btn) {
      const box = document.getElementById("pr-" + i);
      const target = targets[i];
      if (!App.speechSupported()) {
        box.innerHTML = '<div class="feedback-box error-text">此浏览器不支持语音识别。'
          + '<br><span style="font-size:.85rem">建议用 Chrome 或 Safari 打开；若在 LINE 里，'
          + '可点右上角「⋯」→「在浏览器中打开」。你仍然可以先点「先听一遍」听发音、自己跟读。</span></div>';
        return;
      }
      btn.textContent = "⏺ กำลังฟัง..."; btn.disabled = true;
      box.innerHTML = '<div class="loading-pulse"><div style="display:flex;gap:6px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>请朗读...</div>';

        async (final) => {

        () => { btn.textContent = "🎤 跟读"; btn.disabled = false; },
        (err) => {
          const msgs = {
            "not-allowed": "麦克风权限被拒绝。请在浏览器里允许本网站使用麦克风后重试。",
            "service-not-allowed": "浏览器不允许使用语音识别服务。",
            "audio-capture": "找不到麦克风设备。",
            "network": "语音识别需要联网，请检查网络后重试。",
            "no-speech": "没有听到声音，请靠近麦克风再说一次。",
            "aborted": "",
          };
          const m = msgs[err];
          if (m === "") return;  // 用户主动取消，不提示
          box.innerHTML = '<div class="feedback-box error-text">'
            + App.escapeHtml(m || ("语音识别失败（" + err + "）"))
            + '<br><span style="font-size:.85rem">你仍然可以先点「先听一遍」听发音、自己跟读。</span></div>';

    const TONE_MAP = { "ā": "a", "á": "a", "ǎ": "a", "à": "a", "ē": "e", "é": "e", "ě": "e", "è": "e",
      "ī": "i", "í": "i", "ǐ": "i", "ì": "i", "ō": "o", "ó": "o", "ǒ": "o", "ò": "o",
      "ū": "u", "ú": "u", "ǔ": "u", "ù": "u", "ǖ": "v", "ǘ": "v", "ǚ": "v", "ǜ": "v", "ü": "v" };
    function normPinyin(s) {
      return (s || "").toLowerCase().replace(/[āáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜü]/g, c => TONE_MAP[c] || c)
        .replace(/[^a-z]/g, "");
    }
    function normWord(s) { return (s || "").replace(/[\s，。！？、；：""''（）,.!?;:]/g, ""); }

    let dictState = null;

    function showDictation(body) {
      const hasChars = (DATA.hanzi || []).length > 0;
      const hasWords = (DATA.vocab || []).length > 0;
      body.innerHTML = `
        <div class="card" style="margin-top:10px">
          <h2 style="font-size:1rem;margin-bottom:10px">✍️ 听写</h2>
          <label style="font-size:.85rem;color:var(--c-muted)">范围</label>
          <select id="d-scope" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--c-line-2)">
            ${hasWords ? '<option value="words">词语表</option>' : ""}
            ${hasChars ? '<option value="chars">生字表</option>' : ""}
          </select>
          <label style="font-size:.85rem;color:var(--c-muted)">方式</label>
          <select id="d-mode" style="width:100%;margin:6px 0 12px;padding:10px;border-radius:10px;border:1px solid var(--c-line-2)">
            <option value="audio2word">语音听写（听发音，写词语）</option>
            <option value="pinyin2word">看拼音写词语</option>
            <option value="word2pinyin">词语注音（写拼音）</option>
          </select>
          <button class="btn btn-primary btn-block btn-lg" id="d-start">开始听写</button>
          <p class="muted" style="font-size:.78rem;margin-top:10px">听写完成后自动记录成绩，答错的字词会进入错题本。</p>
        </div>`;
      document.getElementById("d-start").onclick = () => {
        const scope = document.getElementById("d-scope").value;
        const mode = document.getElementById("d-mode").value;
        startDictation(body, scope, mode);
      };
    }

    function startDictation(body, scope, mode) {
      const pool = scope === "chars"
        ? (DATA.hanzi || []).map(c => ({ target: c.char, type: "hanzi", ref: c.id, pinyin: c.pinyin }))
        : (DATA.vocab || []).map(w => ({ target: w.word, type: "word", ref: w.id, pinyin: w.pinyin }));
      if (!pool.length) { alert("没有可听写的内容"); return; }
      dictState = { items: pool, idx: 0, results: [], mode, t0: Date.now() };
      renderDictItem(body);
    }

    function renderDictItem(body) {
      const s = dictState;
      if (!s || s.idx >= s.items.length) return finishDictation(body);
      const it = s.items[s.idx];
      const mode = s.mode;
      s.itemStart = Date.now();
      let promptHtml = "";
      if (mode === "audio2word") {
        promptHtml = `<button class="btn btn-primary btn-block btn-lg" id="d-play">🔊 播放读音</button>
          <p class="muted" style="text-align:center;font-size:.8rem;margin-top:6px">听发音，写出词语</p>`;
      } else if (mode === "pinyin2word") {
        promptHtml = `<div style="text-align:center;font-size:1.5rem;letter-spacing:.12em;font-family:monospace">${App.escapeHtml(it.pinyin || "")}</div>
          <p class="muted" style="text-align:center;font-size:.8rem;margin-top:6px">看拼音，写词语</p>`;
      } else {
        promptHtml = `<div class="t-cn" style="text-align:center;font-size:2rem;font-weight:700">${App.escapeHtml(it.target)}</div>
          <p class="muted" style="text-align:center;font-size:.8rem;margin-top:6px">写出这个词语的拼音</p>`;
      }
      body.innerHTML = `
        <div class="card fade-in" style="margin-top:10px">
          <div style="display:flex;justify-content:space-between;margin-bottom:12px">
            <span class="muted t-mono">${s.idx + 1} / ${s.items.length}</span>
            <span class="muted t-mono">已对 ${s.results.filter(r => r.is_correct).length}</span>
          </div>
          ${promptHtml}
          <input id="d-input" type="text" autocomplete="off" autocapitalize="off"
            style="width:100%;padding:14px;margin-top:14px;border-radius:12px;border:1px solid var(--c-line-2);font-size:1.1rem;text-align:center"
            placeholder="${mode === "word2pinyin" ? "输入拼音" : "输入汉字"}">
          <button class="btn btn-primary btn-block btn-lg" id="d-check" style="margin-top:10px">确定</button>
          <div id="d-fb"></div>
        </div>`;
      const input = document.getElementById("d-input");
      input.focus();
      const play = document.getElementById("d-play");
      if (play) play.onclick = () => App.speak(it.target);
      input.onkeydown = (e) => { if (e.key === "Enter") document.getElementById("d-check").click(); };
      document.getElementById("d-check").onclick = () => {
        const val = input.value.trim();
        if (!val) { input.focus(); return; }
        let ok;
        if (mode === "word2pinyin") ok = normPinyin(val) === normPinyin(it.pinyin);
        else ok = normWord(val) === normWord(it.target);
        s.results.push({
          target: it.target, target_type: it.type, ref_id: it.ref,
          input_text: val, is_correct: ok,
          duration_ms: Date.now() - s.itemStart,
        });
        input.disabled = true;
        document.getElementById("d-check").style.display = "none";
        document.getElementById("d-fb").innerHTML = `
          <div class="feedback-box ${ok ? "correct" : "incorrect"}" style="margin-top:12px">
            <div class="verdict-badge ${ok ? "correct" : "incorrect"}">${ok ? "✅ 正确" : "❌ 再记一记"}</div>
            <div>正确答案：<b class="t-cn">${App.escapeHtml(mode === "word2pinyin" ? (it.pinyin || "") : it.target)}</b></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="d-next" style="margin-top:10px">${s.idx === s.items.length - 1 ? "完成听写" : "下一题 →"}</button>`;
        document.getElementById("d-next").onclick = () => {
          s.idx++;
          if (s.idx >= s.items.length) finishDictation(body);
          else renderDictItem(body);
        };
      };
    }

    async function finishDictation(body) {
      const s = dictState;
      if (!s) return;
      const results = s.results;
      const correct = results.filter(r => r.is_correct).length;
      const score = results.length ? Math.round(correct / results.length * 100) : 0;
      body.innerHTML = `
        <div class="card fade-in" style="margin-top:10px;text-align:center">
          <div style="font-size:2.2rem;font-weight:800;color:var(--c-primary-d)">${score} 分</div>
          <div class="muted">共 ${results.length} 题，答对 ${correct} 题</div>
          <div id="d-save" class="muted" style="margin-top:10px;font-size:.85rem">正在保存...</div>
          ${results.filter(r => !r.is_correct).length ? `
            <div style="text-align:left;margin-top:16px">
              <b>需要复习：</b>
              <div style="margin-top:6px">${results.filter(r => !r.is_correct).map(r =>
                `<span class="badge" style="display:inline-block;margin:3px;background:#fdecec;color:#b33;padding:4px 10px;border-radius:999px">${App.escapeHtml(r.target)}</span>`).join("")}</div>
            </div>` : ""}
          <button class="btn btn-primary btn-block btn-lg" id="d-again" style="margin-top:16px">再听写一遍</button>
          <button class="btn btn-ghost btn-block" id="d-back" style="margin-top:8px">返回字词</button>
        </div>`;
      document.getElementById("d-again").onclick = () => showDictation(body);
      document.getElementById("d-back").onclick = () => renderHanzi(document.getElementById("tab-content"));
      try {
        await App.call("/api/dictation/submit", {
          method: "POST",
          body: JSON.stringify({ lesson_no: LESSON, scope: s.items[0].type === "hanzi" ? "chars" : "words",
            mode: s.mode, results })
        });
        document.getElementById("d-save").textContent = "✅ 已保存，错题已进入错题本";
      } catch (e) {
        document.getElementById("d-save").textContent = "保存失败，请检查网络后重试";
      }
    }

    /* ---------- 课文（中文） ---------- */
    function renderTextZh(el) {
      const t = DATA.text;
      if (!t) { el.innerHTML = '<div class="card muted" style="text-align:center">本课暂无课文</div>'; return; }
      const paras = (t.body_zh || "").split(/\n+/).filter(x => x.trim());
      el.innerHTML = `
        <div class="card text-card fade-in">
          <h2 style="margin-bottom: var(--s-2)">${App.escapeHtml(t.title || "")}</h2>
          <button class="btn btn-primary btn-block btn-lg" id="text-say" style="margin-bottom: var(--s-4)">🔊 全文朗读</button>
          <div class="t-cn" style="line-height:2;font-size:1.05rem">
            ${paras.map((p, i) => `<p style="text-indent:2em;margin-bottom:.6em">${App.escapeHtml(p.trim())}
              <button class="sent-mini-play" data-p="${i}" title="朗读本段">🔊</button></p>`).join("")}
          </div>
        </div>
        <div class="card fade-in" style="margin-top:12px">
          <h3 style="font-size:1rem;margin-bottom:8px">🎤 朗读打卡</h3>
          <p class="muted" style="font-size:.82rem">点下面的按钮，选其中一段读出来，AI 会给你评价。</p>
          <button class="btn btn-secondary btn-block" id="read-btn" style="margin-top:8px">开始朗读（选第一段）</button>
          <div id="read-result"></div>
        </div>`;
      const full = paras.join("");
      document.getElementById("text-say").onclick = () => App.speak(full);
      el.querySelectorAll("[data-p]").forEach(b => {
        b.onclick = () => App.speak(paras[parseInt(b.dataset.p)] || "");
      });
      document.getElementById("read-btn").onclick = () => readAloud(paras[0] || full, el);
    }

    function readAloud(target, el) {
      const box = document.getElementById("read-result");
      if (!App.speechSupported()) {
        box.innerHTML = '<div class="feedback-box error-text" style="margin-top:10px">这个浏览器不支持语音识别，可以先跟着「全文朗读」自己读。</div>';
        return;
      }
      box.innerHTML = '<div class="loading-pulse" style="margin-top:10px">请开始朗读...</div>';
      App.speech("zh-CN",
        async (final) => {
          box.innerHTML = `<div class="feedback-box"><b>识别到：</b>${App.escapeHtml(final)}</div><div class="explain-box">AI 评价中...</div>`;
          try {
            const r = await App.call("/api/pronounce", {
              method: "POST",
              body: JSON.stringify({ target_text: target, recognized_text: final })
            });
            box.innerHTML = `<div class="feedback-box"><b>识别到：</b>${App.escapeHtml(r.recognized || final)}</div>
              <div class="explain-box">${App.escapeHtml(r.feedback)}</div>`;
          } catch (e) {
            box.innerHTML = '<div class="feedback-box error-text">评价失败，稍后再试</div>';
          }
        },
        (interim) => { box.innerHTML = `<p class="muted">${App.escapeHtml(interim || "")}</p>`; },
        null,
        (err) => { box.innerHTML = `<div class="feedback-box error-text">语音识别失败（${App.escapeHtml(err)}），可以改用 Chrome 浏览器再试。</div>`; });
    }

    /* ---------- 古诗文 ---------- */
    function renderPoem(el) {
      const poems = DATA.poems || [];
      if (!poems.length) { el.innerHTML = '<div class="card muted" style="text-align:center">本课没有古诗文</div>'; return; }
      el.innerHTML = poems.map((p, i) => `
        <div class="card fade-in" style="margin-bottom:14px" data-poem="${i}">
          <h2 style="text-align:center;font-size:1.2rem">${App.escapeHtml(p.title)}</h2>
          <p style="text-align:center;color:var(--c-muted);font-size:.85rem;margin-top:2px">
            ${App.escapeHtml([p.dynasty, p.author].filter(Boolean).join(" · "))}
          </p>
          <div class="t-cn" style="font-size:1.12rem;line-height:2.1;text-align:center;margin:16px 0;white-space:pre-wrap">${App.escapeHtml(p.body)}</div>
          <button class="btn btn-secondary btn-block" data-say="${i}">🔊 朗读</button>
          ${(p.notes || []).length ? `<details style="margin-top:12px"><summary style="cursor:pointer;font-weight:600">注释</summary>
            <div style="margin-top:8px;font-size:.88rem;line-height:1.8">${p.notes.map(n =>
              `<div><b>${App.escapeHtml(n.word || "")}</b>：${App.escapeHtml(n.note || "")}</div>`).join("")}</div></details>` : ""}
          ${p.translation ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">译文</summary>
            <div style="margin-top:8px;font-size:.9rem;line-height:1.9">${App.escapeHtml(p.translation)}</div></details>` : ""}
          <div style="margin-top:16px">
            <b style="font-size:.95rem">默写检测</b>
            <p class="muted" style="font-size:.78rem;margin:4px 0 6px">不看原文，把这首诗完整默写下来（标点可不写）。</p>
            <textarea id="dict-${i}" rows="5" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--c-line-2)" placeholder="在这里默写..."></textarea>
            <button class="btn btn-primary btn-block" data-check="${i}" style="margin-top:8px">提交默写</button>
            <div id="poem-fb-${i}"></div>
          </div>
        </div>`).join("");
      el.querySelectorAll("[data-say]").forEach(b => {
        b.onclick = () => App.speak(poems[parseInt(b.dataset.say)].body);
      });
      el.querySelectorAll("[data-check]").forEach(b => {
        const i = parseInt(b.dataset.check);
        const p = poems[i];
        b.onclick = async () => {
          const text = document.getElementById("dict-" + i).value.trim();
          if (!text) { alert("请先默写"); return; }
          b.disabled = true; b.textContent = "批改中...";
          try {
            const r = await App.call("/api/recitation/submit", {
              method: "POST",
              body: JSON.stringify({ poem_id: p.id, mode: "full_dictation", input_text: text })
            });
            document.getElementById("poem-fb-" + i).innerHTML = `
              <div class="feedback-box ${r.score >= 80 ? "correct" : "partial"}" style="margin-top:10px">
                <div class="verdict-badge ${r.score >= 80 ? "correct" : "partial"}">得分 ${r.score}</div>
                ${(r.detail.missing_chars || []).length ? `<div style="margin-top:6px">漏写或写错的字：<b>${r.detail.missing_chars.map(c => App.escapeHtml(c)).join(" ")}</b></div>` : "<div>默写完整，很棒！</div>"}
              </div>`;
          } catch (e) {
            document.getElementById("poem-fb-" + i).innerHTML = '<div class="feedback-box error-text">提交失败，请重试</div>';
          } finally { b.disabled = false; b.textContent = "提交默写"; }
        };
      });
    }

    /* ---------- 词句段 ---------- */
    function renderGrammarZh(el) {
      const g = DATA.grammar || [];
      if (!g.length) { el.innerHTML = '<div class="card muted" style="text-align:center">本课暂无词句段内容</div>'; return; }
      el.innerHTML = g.map(p => `
        <div class="card grammar-card fade-in" style="margin-bottom:12px">
          <div class="grammar-point t-cn">${App.escapeHtml(p.point)}</div>
          <div class="grammar-explain" style="line-height:1.9">${App.escapeHtml(p.explanation_zh || "")}</div>
          ${p.example_zh ? `<div class="grammar-example"><div class="ex-zh t-cn">${App.escapeHtml(p.example_zh)}</div></div>` : ""}
        </div>`).join("");
    }

    /* ---------- 练习（中文） ---------- */
    let exIdxZh = 0, exBusyZh = false, examOffset = 0;

    function renderExerciseZh(el) {
      const items = DATA.exercises || [];
      if (!items.length) { el.innerHTML = '<div class="card muted" style="text-align:center">本课暂无练习</div>'; return; }
      if (exIdxZh >= items.length) exIdxZh = 0;
      const it = items[exIdxZh];
      const passage = it.passage_body
        ? `<details class="passage-box" ${it.passage_body.length < 260 ? "open" : ""}>
             <summary>📄 阅读短文：${App.escapeHtml(it.passage_title || "")}</summary>
             <div class="passage-body t-cn">${App.escapeHtml(it.passage_body)}</div>
           </details>`
        : "";
      const opts = Array.isArray(it.options) ? it.options : [];
      const promptOptCount = (it.prompt_zh.match(/(^|[\s\n])[A-D][．.、]/g) || []).length;
      const legacyMcq = !opts.length && /^[A-D]$/i.test((it.answer || "").trim()) && promptOptCount >= 3;
      const answerLen = (it.answer || "").replace(/[；;、,，\s]/g, "").length;
      let answerBox;
      if (opts.length >= 2) {
        const LETTERS = "ABCD";
        const longOpt = opts.some(o => String(o).length > 12);
        const cols = longOpt ? 1 : Math.min(opts.length, 4);
        answerBox = `
          <div class="option-grid" id="opt-grid" style="grid-template-columns:repeat(${cols},1fr)">
            ${opts.map((o, i) => `<button class="opt-btn" data-opt="${LETTERS[i]}">
                <b>${LETTERS[i]}</b><span>${App.escapeHtml(String(o))}</span>
              </button>`).join("")}
          </div>
          <input type="hidden" id="input" value="">`;
      } else if (legacyMcq) {
        answerBox = `
          <div class="option-grid" id="opt-grid">
            ${["A", "B", "C", "D"].map(L => `<button class="opt-btn" data-opt="${L}"><b>${L}</b></button>`).join("")}
          </div>
          <input type="hidden" id="input" value="">`;
      } else if (answerLen <= 20) {
        answerBox = `<div class="exercise-input">
            <input type="text" id="input" autocomplete="off" placeholder="在这里写下答案">
          </div>`;
      } else {
        answerBox = `<div class="exercise-input">
            <textarea id="input" placeholder="在这里写下你的答案..." rows="4"></textarea>
          </div>`;
      }
      const isMcq = opts.length >= 2 || legacyMcq;
      el.innerHTML = `
        <div class="card fade-in">
          <div class="exercise-header">
            <span class="muted t-mono">${exIdxZh + 1} / ${items.length}</span>
            <div class="progress"><div class="bar"><span style="width:${((exIdxZh + 1) / items.length) * 100}%"></span></div></div>
            <span class="badge" style="background:var(--c-primary-l);color:var(--c-primary-d);padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600">${App.escapeHtml(it.q_type || it.module || "练习")}</span>
          </div>
          ${passage}
          <div class="exercise-q t-cn" style="white-space:pre-wrap">${App.escapeHtml(it.prompt_zh)}</div>
          ${answerBox}
          <button class="btn btn-primary btn-block btn-lg" id="btn-submit" style="margin-top:10px">提交</button>
          <div id="feedback"></div>
        </div>`;
      if (isMcq) {
        document.querySelectorAll(".opt-btn").forEach(b => {
          b.onclick = () => {
            document.querySelectorAll(".opt-btn").forEach(x => x.classList.remove("sel"));
            b.classList.add("sel");
            // 连选项内容一起提交，批改时既能认字母也能认意思
            const txt = b.querySelector("span")?.textContent || "";
            document.getElementById("input").value =
              txt ? `${b.dataset.opt}. ${txt}` : b.dataset.opt;
          };
        });
      }
      document.getElementById("btn-submit").onclick = () => submitExerciseZh(it, el);
    }

    async function submitExerciseZh(it, el) {
      if (exBusyZh) return;
      const input = document.getElementById("input").value.trim();
      if (!input) { alert("请先写出答案"); return; }
      exBusyZh = true;
      const btn = document.getElementById("btn-submit");
      btn.disabled = true; btn.textContent = "AI 老师批改中...";
      const fb = document.getElementById("feedback");
      fb.innerHTML = '<div class="loading-pulse" style="margin-top:12px"><span>AI 老师正在看你的答案...</span></div>';
      try {
        const r = await App.call("/api/feedback", {
          method: "POST",
          body: JSON.stringify({ module: it.module, item_id: it.id, input_text: input })
        });
        const map = { correct: ["✅ 答对了", "correct"], partial: ["💡 接近了", "partial"], incorrect: ["💡 再想一想", "incorrect"] };
        const [badge, cls] = map[r.verdict] || ["", ""];
        fb.innerHTML = `
          <div class="feedback-box ${cls} fade-in" style="margin-top:12px">
            <div class="verdict-badge ${cls}">${badge}</div>
            <div style="line-height:1.8">${App.escapeHtml(r.feedback_zh || "")}</div>
            ${r.example_zh ? `<div style="margin-top:8px;font-size:.9rem">📖 范例：${App.escapeHtml(r.example_zh)}</div>` : ""}
          </div>
          <div class="hint-row">
            ${r.hint1_zh ? '<button class="hint-pill" data-h="1">💡 提示一</button>' : ""}
            ${r.hint2_zh ? '<button class="hint-pill" data-h="2">💡💡 提示二</button>' : ""}
            ${r.example_zh ? '<button class="hint-pill" data-h="3">📖 范例</button>' : ""}
            ${r.answer_zh ? '<button class="hint-pill" data-h="4">✅ 参考答案</button>' : ""}
          </div>
          <div id="reveals"></div>
          ${it.explanation ? `<div class="explain-box" style="margin-top:10px"><b>为什么这么答</b><br>${App.escapeHtml(it.explanation)}</div>` : ""}
          <div class="decision-row" id="decision-box">
            <div class="d-q">AI 说得对吗？</div>
            <div class="decision-opts">
              <button data-r="agree">👍 同意</button>
              <button data-r="disagree">👎 不同意</button>
              <button data-r="not_sure">🤔 不确定</button>
            </div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="btn-next" style="margin-top:16px">${exIdxZh === DATA.exercises.length - 1 ? "🎉 完成" : "下一题 →"}</button>`;
        document.getElementById("btn-next").onclick = () => {
          exIdxZh = exIdxZh === DATA.exercises.length - 1 ? 0 : exIdxZh + 1;
          renderExerciseZh(el);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };
        const HINTS = { 1: r.hint1_zh, 2: r.hint2_zh, 3: "📖 " + (r.example_zh || ""), 4: "✅ " + (r.answer_zh || "") };
        fb.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
          const lv = parseInt(b.dataset.h);
          b.disabled = true;
          const div = document.createElement("div");
          div.className = "revealed-hint";
          div.innerHTML = "<b>提示</b> " + App.escapeHtml(HINTS[lv] || "");
          document.getElementById("reveals").appendChild(div);
          App.call("/api/hint", { method: "POST", body: JSON.stringify({ module: it.module, item_id: it.id, hint_level: lv }) }).catch(() => {});
        });
        fb.querySelectorAll("#decision-box [data-r]").forEach(b => b.onclick = async () => {
          const box = document.getElementById("decision-box");
          const kind = b.dataset.r;
          let text = "";
          if (kind === "disagree") text = (prompt("说说你为什么不同意（可留空）") || "").trim();
          box.querySelectorAll("[data-r]").forEach(x => { x.disabled = true; });
          b.classList.add("chosen");
          try {
            await App.call("/api/feedback/reason", {
              method: "POST",
              body: JSON.stringify({ reason_type: kind, reason_text: text, item_id: it.id })
            });
          } catch (e) {}
          box.insertAdjacentHTML("beforeend", '<div class="decision-done" style="margin-top:8px">✅ 已记录</div>');
        });
      } catch (e) {
        fb.innerHTML = '<div class="feedback-box error-text" style="margin-top:12px">提交失败，请稍后重试</div>';
      } finally {
        exBusyZh = false;
        btn.disabled = false; btn.textContent = "提交";
      }
    }

    /* ---------- 随堂测（中文） ---------- */
    function renderExamZh(el) {
      const qs = DATA.exam || [];
      if (!qs.length) { el.innerHTML = '<div class="card muted" style="text-align:center">本课暂无测验</div>'; return; }
      el.innerHTML = `
        <div class="exercise-header">
          <span class="muted t-mono">${examOffset ? (qs.length > 1 ? `第 ${examOffset + 1}–${examOffset + qs.length} 题` : `第 ${examOffset + 1} 题`) : `${qs.length} 题`}</span>
          <div class="progress"><div class="bar"><span id="exam-bar" style="width:0%"></span></div></div>
          <span class="muted t-mono" id="exam-done">0 / ${qs.length}</span>
        </div>` + qs.map((q, i) => `
          <div class="card exam-card fade-in" data-qi="${q.id}">
            <div class="exam-q-meta"><span class="num">${examOffset + i + 1}</span>
              <span class="t-mono" style="margin-left:auto">${App.escapeHtml(q.q_type || "")}</span></div>
            <div class="exam-q-text t-cn">${App.escapeHtml(q.question_zh)}</div>
            <div class="exam-options">
              ${["A", "B", "C", "D"].map(l => `<button class="exam-opt" data-q="${q.id}" data-opt="${l}">
                <span class="letter">${l}</span><span class="t-cn">${App.escapeHtml(q["option_" + l.toLowerCase()] || "")}</span></button>`).join("")}
            </div>
          </div>`).join("") +
        '<button class="btn btn-primary btn-block btn-xl fade-in" id="btn-exam" style="margin-top:16px">交卷</button><div id="exam-result"></div>';
      el.querySelectorAll(".exam-opt").forEach(b => {
        b.onclick = () => {
          const qid = b.dataset.q;
          el.querySelectorAll(`.exam-opt[data-q="${qid}"]`).forEach(x => x.classList.remove("selected"));
          b.classList.add("selected");
          updateExamProgress();
        };
      });
      document.getElementById("btn-exam").onclick = async () => {
        const answers = [];
        el.querySelectorAll(".exam-opt.selected").forEach(b => answers.push({ exam_id: parseInt(b.dataset.q), chosen: b.dataset.opt }));
        if (!answers.length) { alert("请至少选 1 题"); return; }
        const btn = document.getElementById("btn-exam");
        btn.disabled = true; btn.textContent = "判分中...";
        try {
          const r = await App.call("/api/exam/submit", { method: "POST", body: JSON.stringify({ lesson_no: LESSON, answers }) });
          document.getElementById("exam-result").innerHTML = `
            <div class="card fade-in" style="margin-top:12px;text-align:center;background:linear-gradient(135deg,var(--c-primary-l),#e9f7ee);border:2px solid var(--c-primary)">
              <div style="font-size:2.5rem;font-weight:800;color:var(--c-primary-d)">${r.score} 分</div>
              <div class="muted" style="margin-top:4px">答对 ${r.correct} / ${r.total} 题</div>
            </div>` + r.results.map((res, i) => `
            <div class="card ${res.is_correct ? "" : "wrong"}" style="margin-top:10px">
              <div class="exam-q-meta"><span class="num">${i + 1}</span>
                <span style="color:${res.is_correct ? "var(--c-primary-d)" : "var(--c-danger)"};font-weight:600">
                  ${res.is_correct ? "✅ 正确" : `❌ 你选 ${res.chosen || "-"} · 答案 ${res.correct_letter}`}</span></div>
              <div class="exam-q-text t-cn">${App.escapeHtml(res.question_zh)}</div>
              ${res.explanation ? `<div class="explain-box">${App.escapeHtml(res.explanation)}</div>` : ""}
            </div>`).join("");
          btn.style.display = "none";
          window.scrollTo({ top: document.getElementById("exam-result").offsetTop - 80, behavior: "smooth" });
        } catch (e) { alert("交卷失败"); btn.disabled = false; btn.textContent = "交卷"; }
      };
    }

    /* ---------- 朗读 ---------- */
    function renderPronounceZh(el) {
      const t = DATA.text;
      const paras = ((t && t.body_zh) || "").split(/\n+/).filter(x => x.trim());
      if (!paras.length) { el.innerHTML = '<div class="card muted" style="text-align:center">暂无朗读内容</div>'; return; }
      el.innerHTML = `<div class="card fade-in" style="margin-bottom:12px">
        <h2 style="font-size:1rem">🎤 朗读练习</h2>
        <p class="muted" style="font-size:.85rem">先听一遍，再点「跟读」读出选中的段落。</p></div>` +
        paras.map((p, i) => `
          <div class="card fade-in" style="margin-bottom:10px;padding:14px">
            <div class="t-cn" style="line-height:1.9;margin-bottom:10px">${App.escapeHtml(p.trim())}</div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-secondary" style="flex:1" data-listen="${i}">🔊 先听</button>
              <button class="btn btn-primary" style="flex:1" data-read="${i}">🎤 跟读</button>
            </div>
            <div id="pr2-${i}"></div>
          </div>`).join("");
      el.querySelectorAll("[data-listen]").forEach(b => b.onclick = () => App.speak(paras[parseInt(b.dataset.listen)]));
      el.querySelectorAll("[data-read]").forEach(b => b.onclick = () => {
        const i = parseInt(b.dataset.read);
        const box = document.getElementById("pr2-" + i);
        if (!App.speechSupported()) { box.innerHTML = '<div class="feedback-box error-text" style="margin-top:8px">此浏览器不支持语音识别，可以先听读。</div>'; return; }
        box.innerHTML = '<div class="loading-pulse" style="margin-top:8px">请朗读...</div>';
        App.speech("zh-CN",
          async (final) => {
            box.innerHTML = `<div class="feedback-box" style="margin-top:8px"><b>识别到：</b>${App.escapeHtml(final)}</div>`;
            try {
              const r = await App.call("/api/pronounce", { method: "POST",
                body: JSON.stringify({ target_text: paras[i], recognized_text: final }) });
              box.insertAdjacentHTML("beforeend", `<div class="explain-box">${App.escapeHtml(r.feedback)}</div>`);
            } catch (e) {}
          },
          null, null,
          (err) => { box.innerHTML = `<div class="feedback-box error-text" style="margin-top:8px">识别失败（${App.escapeHtml(err)}）</div>`; });
      });
    }
  </script>
</body>
</html>
