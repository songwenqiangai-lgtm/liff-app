<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>หน้าหลัก · 中文小老师</title>
  <link rel="stylesheet" href="/assets/style.css?v=8">
  <style>
    .home-hero { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-4) var(--s-4) var(--s-3); }
    .home-hero img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; box-shadow: var(--sh-1); flex-shrink: 0; }
    .home-hero .who { flex: 1; min-width: 0; }
    .home-hero .name { font-weight: 700; font-size: 1.05rem; color: var(--c-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-hero .role { color: var(--c-muted); font-size: .8rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .home-hero .bell { flex-shrink: 0; }
    .logout-bar { padding: var(--s-4) var(--s-4) calc(var(--s-6) + env(safe-area-inset-bottom)); }
    .logout-btn { display: block; width: 100%; padding: 14px; border-radius: var(--r-md);
      background: #fff; color: var(--c-muted); border: 1px solid var(--c-line-2);
      font-size: .9rem; font-family: inherit; cursor: pointer; }
    .logout-btn:active { background: var(--c-primary-l); }
    .entry-grid { display: flex; flex-direction: column; gap: var(--s-3); padding: var(--s-3) var(--s-4); }
    .entry-card { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-5) var(--s-5);
      background: #fff; border-radius: var(--r-xl); box-shadow: var(--sh-2);
      text-decoration: none; color: inherit; transition: all var(--t-norm); position: relative; overflow: hidden; }
    .entry-card:active { transform: scale(.98); }
    .entry-card .ec-icon { width: 64px; height: 64px; border-radius: 20px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-primary-d));
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; flex-shrink: 0; box-shadow: 0 4px 12px rgba(31,138,95,.25); }
    .entry-card.ask .ec-icon { background: linear-gradient(135deg, #2e6cb0, #1f4e8a); box-shadow: 0 4px 12px rgba(46,108,176,.25); }
    .entry-card.report .ec-icon { background: linear-gradient(135deg, #7b5cc4, #5a3f9e); box-shadow: 0 4px 12px rgba(123,92,196,.25); }
    .entry-card .ec-text { flex: 1; }
    .entry-card .ec-zh { font-weight: 700; font-size: 1.1rem; color: var(--c-text); font-family: "Noto Sans SC", sans-serif; }
    .entry-card .ec-th { color: var(--c-muted); font-size: .85rem; margin-top: 2px; }
    .entry-card .ec-arrow { color: var(--c-muted); font-size: 1.2rem; }
    .home-mascot { display: flex; justify-content: center; margin: var(--s-6) 0 var(--s-4); }
    .home-mascot svg { width: 100px; height: 100px; }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="home-hero">
      <a href="profile.html" style="flex-shrink:0"><img src="/assets/logo.jpg" alt="" id="me-avatar"></a>
      <div class="who">
        <div class="name" id="who">学生</div>
        <div class="role" id="who-sig">สวัสดี · 欢迎回来</div>
      </div>
      <a class="bell" href="notifications.html" title="通知">🔔<span class="dot-badge" id="bell-badge" style="display:none"></span></a>
    </div>

    <div class="entry-grid">
      <a class="entry-card ask" href="ask.html">
        <div class="ec-icon">💬</div>
        <div class="ec-text">
          <div class="ec-zh">AI 提问</div>
          <div class="ec-th">ถามครู AI · 用泰/英/中提问</div>
        </div>
        <div class="ec-arrow">→</div>
      </a>

      <a class="entry-card lessons" href="lessons.html">
        <div class="ec-icon">📚</div>
        <div class="ec-text">
          <div class="ec-zh">课程学习</div>
          <div class="ec-th">เรียนตามบทที่ได้รับ · 按分配的课学习</div>
        </div>
        <div class="ec-arrow">→</div>
      </a>

      <a class="entry-card report" href="report.html">
        <div class="ec-icon">📈</div>
        <div class="ec-text">
          <div class="ec-zh">我的报告</div>
          <div class="ec-th">รายงานและจุดอ่อน · 周报 / 统计 / 薄弱点 / 建议</div>
        </div>
        <div class="ec-arrow">→</div>
      </a>

      <a class="entry-card" href="offline.html" id="offline-entry" style="display:none">
        <div class="ec-icon">📝</div>
        <div class="ec-text">
          <div class="ec-zh">线下任务</div>
          <div class="ec-th">งานฝึกไม่มี AI · 无 AI 测试周任务</div>
        </div>
        <div class="ec-arrow">→</div>
      </a>
    </div>

    <div class="home-mascot">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="#fff" stroke="#1f8a5f" stroke-width="3"/>
        <circle cx="26" cy="32" r="11" fill="#1f3d33"/>
        <circle cx="74" cy="32" r="11" fill="#1f3d33"/>
        <circle cx="42" cy="50" r="3" fill="#1f3d33"/>
        <circle cx="58" cy="50" r="3" fill="#1f3d33"/>
        <circle cx="42" cy="50" r="1" fill="#fff"/>
        <circle cx="58" cy="50" r="1" fill="#fff"/>
        <ellipse cx="50" cy="60" rx="2.5" ry="1.5" fill="#1f3d33"/>
        <path d="M 45 65 Q 50 70 55 65" stroke="#1f3d33" stroke-width="2" fill="none" stroke-linecap="round"/>
        <text x="50" y="88" text-anchor="middle" font-size="10" fill="#1f8a5f" font-weight="600">加油！</text>
      </svg>
    </div>

    <div class="logout-bar">
      <button class="logout-btn" id="btn-out">🚪 ออกจากระบบ · 退出登录</button>
    </div>
  </div>

  <script src="/assets/app.js?v=8"></script>
  <script>
    if (!App.requireLogin()) {
      // 跳走
    } else {
      // 先用本地缓存渲染，避免白屏
      document.getElementById("who").textContent =
        localStorage.getItem("display_name") || "学生";
      document.getElementById("btn-out").onclick = () => {
        if (confirm("确认退出登录？· ยืนยันออกจากระบบ?")) App.logout();
      };
      // 拉最新资料（姓名 / 头像 / 签名）
      App.call("/api/profile").then(me => {
        document.getElementById("who").textContent = me.display_name || "学生";
        if (me.signature) {
          document.getElementById("who-sig").textContent = me.signature;
        }
        if (me.avatar_url) {
          document.getElementById("me-avatar").src = me.avatar_url;
        }
        localStorage.setItem("display_name", me.display_name || "");
        localStorage.setItem("avatar_url", me.avatar_url || "");
      }).catch(() => {});
      // 未读通知徽标（F6/F8/F12）
      App.call("/api/notifications/unread_count").then(r => {
        if (r && r.unread > 0) {
          const b = document.getElementById("bell-badge");
          b.textContent = r.unread > 99 ? "99+" : r.unread;
          b.style.display = "flex";
        }
      }).catch(() => {});
      // T1/T2 阶段才显示线下任务入口（F10）
      App.call("/api/offline_task").then(r => {
        if (r && r.active) document.getElementById("offline-entry").style.display = "flex";
      }).catch(() => {});
    }
  </script>
</body>
</html>
