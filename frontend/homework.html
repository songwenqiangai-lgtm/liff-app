<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>今日作业 · 中文六年级</title>
  <link rel="stylesheet" href="/assets/style.css?v=8">
  <style>
    .hw-row { display:block; padding: var(--s-4); margin: 0 var(--s-4) var(--s-3);
      background:#fff; border-radius: var(--r-lg); box-shadow: var(--sh-1);
      text-decoration:none; color:inherit; }
    .hw-row.pending { border-left: 4px solid #d9772e; }
    .hw-row.done { border-left: 4px solid var(--c-primary); opacity:.75; }
    .hw-title { font-weight:700; font-size:1.05rem; }
    .hw-meta { display:flex; gap:12px; margin-top:6px; font-size:.8rem; color:var(--c-muted); flex-wrap:wrap; }
    .hw-status { display:inline-block; padding:2px 9px; border-radius:999px; font-size:.72rem; font-weight:700; }
    .hw-status.pending { background:#fdf1e6; color:#b85c1a; }
    .hw-status.done { background:var(--c-primary-l); color:var(--c-primary-d); }
    .hw-status.late { background:#fdecec; color:#b33; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="back" href="home.html">← 返回</a>
    <h1>📝 今日作业</h1>
    <div style="width:40px"></div>
  </div>
  <div id="app" class="app-wrap fade-in loading-pulse" style="text-align:center;padding-top:40px">正在加载...</div>
  <script src="/assets/app.js?v=8"></script>
  <script>
    if (!App.requireLogin()) { /* redirect */ } else { load(); }

    const TYPE_LABEL = {
      dictation: "听写", exercise: "练习", exam: "测验", writing: "习作",
      recitation: "背诵默写", reading: "课外阅读", offline: "线下任务",
    };

    function fmtDate(s) {
      if (!s) return "";
      const d = new Date(s.replace(" ", "T") + "Z");
      if (isNaN(d)) return s;
      return d.toLocaleString("zh-CN", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
    }

    function target(a) {
      const ref = a.ref || {};
      if (a.type === "writing") return "writing.html?task_id=" + (ref.task_id || "");
      if (a.type === "recitation") return "poems.html";
      const mod = { dictation: "hanzi", exercise: "exercise", exam: "exam" }[a.type] || "hanzi";
      if (ref.lesson_no) return `lesson.html?lesson=${ref.lesson_no}&module=${mod}`;
      return "lessons.html";
    }

    async function load() {
      const app = document.getElementById("app");
      let rows = [];
      try {
        const r = await App.call("/api/homework");
        rows = r.assignments || [];
      } catch (e) {
        app.innerHTML = '<div class="card">作业加载失败，请稍后重试</div>';
        return;
      }
      if (!rows.length) {
        app.innerHTML = `<div class="card" style="text-align:center;padding:32px">
          <div style="font-size:2rem">🌱</div>
          <div style="margin-top:8px">老师还没有布置作业</div>
          <div class="muted" style="font-size:.85rem;margin-top:4px">先去预习一下课文吧</div>
        </div>`;
        return;
      }
      const pending = rows.filter(a => a.status === "pending").length;
      app.innerHTML = `
        <div class="card" style="margin-bottom:12px;display:flex;align-items:center;gap:10px">
          <div style="font-size:1.6rem">📝</div>
          <div>
            <div style="font-weight:700">${pending ? `还有 ${pending} 项作业待完成` : "作业都完成啦，真棒！"}</div>
            <div class="muted" style="font-size:.8rem">共 ${rows.length} 项</div>
          </div>
        </div>` + rows.map(a => {
          const st = a.status === "pending" ? "pending" : (a.status === "late" ? "late" : "done");
          const label = { pending: "待完成", late: "迟交", submitted: "已提交", graded: "已批改" }[a.status] || a.status;
          return `<div class="hw-row ${st}">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span class="hw-title">${App.escapeHtml(a.title)}</span>
              <span class="hw-status ${st}">${label}</span>
            </div>
            <div class="hw-meta">
              <span>${TYPE_LABEL[a.type] || a.type}</span>
              ${a.due_at ? `<span>截止 ${fmtDate(a.due_at)}</span>` : ""}
              ${a.score != null ? `<span>得分 ${a.score}</span>` : ""}
            </div>
            ${a.instructions ? `<div style="font-size:.85rem;color:var(--c-text-2);margin-top:8px">${App.escapeHtml(a.instructions)}</div>` : ""}
            <div style="display:flex;gap:8px;margin-top:10px">
              <a class="btn btn-primary btn-sm" href="${target(a)}" style="flex:1;text-align:center">${a.status === "pending" ? "去完成" : "再练一次"}</a>
              ${a.status === "pending" ? `<button class="btn btn-ghost btn-sm" data-done="${a.id}" style="flex:1">标记已完成</button>` : ""}
            </div>
          </div>`;
        }).join("");
      app.querySelectorAll("[data-done]").forEach(b => b.onclick = async () => {
        b.disabled = true; b.textContent = "提交中...";
        try {
          await App.call("/api/homework/" + b.dataset.done + "/submit", { method: "POST", body: JSON.stringify({}) });
          location.reload();
        } catch (e) { b.disabled = false; b.textContent = "标记已完成"; }
      });
    }
  </script>
</body>
</html>
